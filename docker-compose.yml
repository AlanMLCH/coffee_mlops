# Local services, one profile per capability, so you start only what you need:
#   docker compose --profile ml  up -d    # MLflow (tracking + registry)
#   docker compose --profile api up -d    # prediction APIs: coffee, and each shop
#   docker compose --profile ai  up -d    # vector DB and agent (stage 3)
# The pipelines themselves run natively with uv (see the Makefile).
name: coffee-mlops

# What every prediction API container shares; each names its tenant and port below.
x-api: &api
  profiles: [api, all]
  build: .
  image: coffee-mlops-api
  volumes:
    - ./data:/data:ro
    - model-cache:/cache
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
    interval: 10s
    timeout: 5s
    retries: 6
  restart: unless-stopped

x-api-env: &api-env
  MLOPS_DATA_DIR: /data
  # The data mount is read-only, so the champion copy lives in its own volume.
  MLOPS_MODEL_CACHE_DIR: /cache
  MLOPS_MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  mlflow:
    profiles: [ml, all]
    # Same version as the client pinned in uv.lock.
    image: ghcr.io/mlflow/mlflow:v3.16.1
    # One web worker and no async job runner (GenAI scorers, not used until stage 3):
    # the defaults spawn ~10 Python processes and ~2 GB of RAM on this laptop.
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000" # this machine only, never the LAN
    volumes:
      # Named volume, not a bind mount: SQLite locking is unreliable over Windows bind mounts.
      # Experiment history is not rebuildable from the pipeline, so it outlives `down`.
      - mlflow:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # The prediction API: one container per tenant, each naming its domain or subdomain
  # (`coffee/<shop>`) - with several installed the API refuses to guess which to serve.
  # One image for all of them.
  api:
    <<: *api
    environment:
      <<: *api-env
      MLOPS_DOMAIN: coffee
    ports:
      - "127.0.0.1:8000:8000"

  # Coffee's shops, a container each: the shop's explorer and agent reach it with
  # MLOPS_API_URL (http://127.0.0.1:8001 for Café de Barrio, 8002 for Café de Paso).
  api-cafe-de-barrio:
    <<: *api
    environment:
      <<: *api-env
      MLOPS_DOMAIN: coffee/cafe_de_barrio
    ports:
      - "127.0.0.1:8001:8000"

  api-cafe-de-paso:
    <<: *api
    environment:
      <<: *api-env
      MLOPS_DOMAIN: coffee/cafe_de_paso
    ports:
      - "127.0.0.1:8002:8000"

  qdrant:
    profiles: [ai, all]
    # Pinned, and the client in uv.lock is the same minor version.
    image: qdrant/qdrant:v1.19.1
    environment:
      # Qdrant reports usage to its makers by default; nothing here needs to leave the laptop.
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:6333:6333" # REST, this machine only
    volumes:
      # An index derived from the Parquet layers: rebuildable with `make index`, but a
      # rebuild re-embeds every chunk, so it outlives `down` too.
      - qdrant:/qdrant/storage
    healthcheck:
      # The image has bash but no curl: an open port is the readiness it can check.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  mlflow:
  model-cache:
  qdrant:
