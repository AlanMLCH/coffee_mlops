# Local services, one profile per capability, so you start only what you need:
#   docker compose --profile ml  up -d    # MLflow (tracking + registry)
#   docker compose --profile api up -d    # prediction API
#   docker compose --profile ai  up -d    # vector DB and agent (stage 3)
# The pipelines themselves run natively with uv (see the Makefile).
name: coffee-mlops

services:
  mlflow:
    profiles: [ml, all]
    # Same version as the client pinned in uv.lock.
    image: ghcr.io/mlflow/mlflow:v3.16.1
    # One web worker and no async job runner (GenAI scorers, not used until stage 3):
    # the defaults spawn ~10 Python processes and ~2 GB of RAM on this laptop.
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000" # this machine only, never the LAN
    volumes:
      # Named volume, not a bind mount: SQLite locking is unreliable over Windows bind mounts.
      # Experiment history is not rebuildable from the pipeline, so it outlives `down`.
      - mlflow:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  api:
    profiles: [api, all]
    build: .
    environment:
      COFFEE_DATA_DIR: /data
      # The data mount is read-only, so the champion copy lives in its own volume.
      COFFEE_MODEL_CACHE_DIR: /cache
      COFFEE_MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/data:ro
      - model-cache:/cache
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  mlflow:
  model-cache:
