# Committed: the dashboard must start the same way for everyone.
[server]
# Headless skips the first-run email prompt, which otherwise blocks `make dashboard`.
headless = true
# This machine only. The default binds every interface and prints a LAN and an external
# URL, which is not what a local analysis tool should do.
address = "127.0.0.1"

[browser]
gatherUsageStats = false
