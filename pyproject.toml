[project]
name = "coffee-mlops"
version = "0.1.0"
description = "End-to-end ML/AI engineering platform, bootstrapped on the coffee domain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Shared foundation only: config, storage layout, contracts and SQL access.
dependencies = [
    "pandera[polars]>=0.33.1",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

# One extra per capability, so a service installs only what it runs:
#   uv sync --extra data   -> ETL only
#   uv sync --extra ml     -> model pipeline only
#   uv sync --all-extras   -> development
[project.optional-dependencies]
# duckdb is the SQL window onto the layers: the pipelines and the analysis need it,
# the prediction API does not (and it is 58 MB in that image).
data = [
    "duckdb>=1.5.5",
    # The engine polars reads workbooks with (Rust, no pandas): the World Bank publishes
    # its price history as .xlsx.
    "fastexcel>=0.21.0",
    "httpx>=0.28.1",
    # The ICO publishes its daily prices as a one-page PDF table; the corpus is PDFs too.
    "pypdf>=6.19.0",
]
ml = [
    "duckdb>=1.5.5",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "optuna>=5.0.0",
    "scikit-learn>=1.9.1",
]
serving = [
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    # Skinny, not full MLflow: the API only *loads* a model. The full package ships the
    # tracking server (flask, alembic, graphene, matplotlib, docker) that no client runs.
    "mlflow-skinny>=3.16.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "skops>=0.15.0", # the format MLflow stores sklearn models in
    "uvicorn>=0.53.0",
]
# Reads every layer and scores the champion, so it needs the model pipeline.
analysis = [
    "coffee-mlops[ml]",
    "matplotlib>=3.11.2",
    "streamlit>=1.52.0",
]

# The corpus the agent explains from - PDFs and article XML into text - and how its
# retrieval is judged. `cryptography` because the SCA's standards are encrypted with
# permissions (pypdf opens them with an empty password, but needs AES to do it).
rag = [
    "coffee-mlops[data]",
    "cryptography>=46.0.5",
    # The stdlib XML parser is a known hazard on files from the internet; this is the
    # standard mitigation, and Europe PMC's articles are XML.
    "defusedxml>=0.7.1",
    # Every retrieval evaluation is a run, like every model.
    "mlflow>=3.16.1",
    # The same minor version as the server in docker-compose.yml.
    "qdrant-client>=1.19.1",
    # BM25's stemmer: the Snowball English one Lucene and Elasticsearch ship. Pure Python.
    "snowballstemmer>=3.0",
]

# Dagster orchestrates the pipelines and the monitor, so it needs all three.
orchestration = [
    "coffee-mlops[data,ml,monitoring]",
    "dagster>=1.13.23",
    "dagster-webserver>=1.13.23",
]
# The agent: a LangGraph workflow over the three tools, which need retrieval.
agent = [
    "coffee-mlops[rag]",
    "langgraph>=1.2.12",
]
# The same three tools over MCP, for clients this project does not write. mcp 2.x: its
# server class is MCPServer (1.x called it FastMCP).
mcp = [
    "coffee-mlops[rag]",
    "mcp>=2.2.0",
]
# Drift between periods, and whether a model's error left the interval it was accepted
# with. Evidently's statistical tests (K-S, chi-squared, Wasserstein, ...) and its HTML
# report; it brings some twenty packages, which is why it is an extra of its own. Every
# report is also an MLflow run.
monitoring = [
    "coffee-mlops[ml]",
    "evidently>=0.7.23",
]

[project.urls]
# Sent in the user agent, so a service that sees trouble knows who to contact.
Repository = "https://github.com/AlanMLCH/coffee_mlops"

[project.scripts]
mlops = "mlops_core.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# The distribution keeps the repository's name; the code inside it is named for what it
# is. `mlops_core` knows no domain; each domain is a package of its own under `domains`.
[tool.uv.build-backend]
module-name = ["mlops_core", "domains"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
# Experiments are typed too: they are read as evidence, so they must be correct.
files = ["src/mlops_core", "src/domains", "experiments"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "snowballstemmer", "evidently.*"] # ship no type information
ignore_missing_imports = true

[tool.coverage.run]
# The dashboard is exercised through Streamlit's AppTest, which runs the file as its
# own script: the tests do cover it, coverage just cannot attribute the lines.
omit = ["*/analysis/dashboard.py"]

[tool.coverage.report]
# The project keeps full coverage; a drop should fail rather than be noticed later.
fail_under = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: hits the real internet; excluded from CI (run with `-m network`)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-defusedxml>=0.7",
    "types-pyyaml>=6.0.12.20260906",
]
