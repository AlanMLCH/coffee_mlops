[project]
name = "coffee-mlops"
version = "0.1.0"
description = "End-to-end ML/AI engineering platform, bootstrapped on the coffee domain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["coffee_mlops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: hits the real internet; excluded from CI (run with `-m network`)",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
