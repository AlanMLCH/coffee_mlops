# Domain config for coffee. Everything domain-specific that is data, not code, lives here.
name: coffee

sources:
  # CQI snapshot scraped in 2018 (1,311 arabica reviews, graded 2010-2018). MIT license.
  # Pinned to a commit so the download is reproducible.
  cqi_2018:
    url: https://raw.githubusercontent.com/jldbc/coffee-quality-database/e3b22b2b1e597887188b97c2ada7f745e1914ec7/data/arabica_data_cleaned.csv
    filename: arabica_data_cleaned.csv
    null_values: ["NA"] # written by R

  # CQI snapshot re-scraped in May 2023 (207 arabica reviews, graded 2022-2023).
  # Public Kaggle download: no token needed, 302 to a signed GCS URL.
  cqi_2023:
    url: https://www.kaggle.com/api/v1/datasets/download/fatihb/coffee-quality-data-cqi
    filename: coffee-quality-data-cqi.zip
    member: df_arabica_clean.csv

  # USDA PSD coffee: production, trade and stocks by country and market year.
  # Republished with each circular (June and December).
  psd_coffee:
    url: https://apps.fas.usda.gov/psdonline/downloads/psd_coffee_csv.zip
    filename: psd_coffee_csv.zip
    member: psd_coffee.csv

  # INEGI's 2020 geostatistical framework for Mexico City: the official borough
  # polygons, and the only way to place a coordinate in an alcaldia. Verified
  # 2026-09-20: 83 MB ZIP, layer 09mun has the 16 alcaldias, and their areas add up to
  # 1,486 km2 against the 1,495 km2 the city publishes.
  cdmx_boroughs:
    url: https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/marcogeo/889463807469/09_ciudaddemexico.zip
    filename: 09_ciudaddemexico.zip
    member: conjunto_de_datos/09mun.shp
    spatial:
      # The DBF is Latin-1. Read as UTF-8 it does not come out wrong, it fails.
      encoding: ISO-8859-1
      # MEXICO_ITRF_2008_LCC, in metres. Points arrive in WGS84, so the polygons are
      # reprojected once on the way in.
      crs: EPSG:6372
      id_column: CVEGEO # entity + municipality, e.g. 09015 is Cuauhtemoc
      name_column: NOMGEO
      expected_features: 16 # the 16 alcaldias

# Stage 2, token required (COFFEE_DENUE_TOKEN). Verified against the live API on
# 2026-09-20: class 722515 has 9,860 establishments in Mexico City.
denue:
  name: denue_cafes
  base_url: https://www.inegi.org.mx/app/api/denue/v1/consulta
  entity: "09" # Mexico City
  # "Cafeterías, fuentes de sodas, neverías, refresquerías y similares": the class is
  # wider than coffee, so the whole class is kept and flagged during cleaning.
  activity_class: "722515"
  page_size: 100 # the service's own page size
  filename: denue_cafes.json
  # A free public service: one request every second is plenty for 99 pages.
  rate_limit_seconds: 1.0

# Stage 2, no credential. Verified against the live API on 2026-09-20: 1,125 elements
# tagged amenity=cafe in Mexico City (1,031 nodes, 94 ways, 0 relations).
overpass:
  name: osm_cafes
  base_url: https://overpass-api.de/api/interpreter
  area_iso: MX-CMX # ISO 3166-2 code of Mexico City
  amenity: cafe
  filename: osm_cafes.json
  # Overpass' own budget, deliberately under the client's 60 s read timeout: when the
  # query is too big we want the server's explanation, not a bare client timeout.
  timeout_s: 50
  # A volunteer-run instance with a fair-use policy (it answered 429 twice while this
  # source was being verified). One query per run, and the client retries a 429.
  rate_limit_seconds: 2.0

# Rules for the clean layer. Vocabularies are closed on purpose: an unseen label
# stops the pipeline so it gets mapped deliberately instead of guessed.
cleaning:
  # Plausible arabica growing altitude; values outside become null (1 m, 190 km, unconverted feet).
  altitude_m: [300, 3000]

  # CQI name -> PSD name. Hawaii and Puerto Rico are the whole of US production in PSD.
  country_aliases:
    "United States (Hawaii)": United States
    "United States (Puerto Rico)": United States
    "Tanzania, United Republic Of": Tanzania
    "Cote d?Ivoire": Cote d'Ivoire # already mis-encoded upstream

  # Lower-cased label -> canonical method.
  processing_methods:
    washed / wet: washed
    natural / dry: natural
    pulped natural / honey: honey
    honey,mossto: honey
    semi-washed / semi-pulped: semi_washed
    semi washed: semi_washed
    semi-lavado: semi_washed
    wet hulling: semi_washed
    other: other
    # Experimental fermentations: too few rows to stand as their own class.
    double anaerobic washed: other
    anaerobico 1000h: other
    double carbonic maceration / natural: other

  # Lower-cased label -> canonical green-bean color; null means "not recorded".
  colors:
    green: green
    greenish: green
    blue-green: blue-green
    bluish-green: blue-green
    yellow-green: yellow-green
    yellow green: yellow-green
    yellow- green: yellow-green
    yello-green: yellow-green
    yellowish: yellowish
    pale yellow: yellowish
    brownish: brownish
    browish-green: brownish
    none: null

# What the model sees. Fitted transforms (encoding, rare-category grouping) live in
# the model pipeline, learned on the training split only.
model:
  target: total_cup_points
  # Dropping `country` and `variety` looked like a large win when every candidate used
  # the same fixed hyperparameters (test MAE 1.808 -> 1.560). Tuned properly, the
  # difference disappears: 1.656 against the champion's 1.648, 38% confidence. They stay.
  # See experiments/feature_ablation.py and the model card.
  categorical: [country, variety, processing_method, color]
  numeric:
    - altitude_m
    - moisture_pct
    - category_one_defects
    - category_two_defects
    - quakers
    # Market context of the origin country, market year = grading year - 1 (point in time).
    - ctx_production
    - ctx_arabica_share
    - ctx_export_share
    - ctx_domestic_consumption
  # Never features: the target is literally their sum (verified on both snapshots).
  leakage:
    [aroma, flavor, aftertaste, acidity, body, balance, uniformity, clean_cup, sweetness, overall]

training:
  # Temporal split: train on gradings up to 2018, evaluate on 2022-2023 (the 2023 snapshot).
  test_from: 2019-01-01
  cv_folds: 5 # time-ordered folds inside the training period, for tuning
  trials: 40
  seed: 42
  # The model must beat predicting each group's training mean to be promoted.
  baseline_group: country
  # Promotion needs evidence, not a better point estimate: with ~200 test rows a gap of
  # 0.1 MAE is noise. A candidate must win this share of paired bootstrap resamples.
  bootstrap_resamples: 5000
  min_probability_better: 0.95
  # Per-group metrics and how each group's weight changed between train and test.
  stratify_by: country
  min_group_size: 5
  # Lots used to estimate the level shift when simulating a deployed recalibration.
  recalibration_window: 30
  registered_model: coffee-total-cup-points

# The analysis pipeline: what to profile and which slice of the market to summarise.
analysis:
  # Column that separates periods; drift and composition are measured across it.
  period_column: snapshot
  # Groups and levels smaller than this are not reported: the numbers would be noise.
  min_rows: 5
  market_year: 2025
  top_countries: 10
  # The country the domestic-market view follows through time.
  spotlight_country: Mexico
  history_since: 2015
  permutation_repeats: 10
  # Figures copied into docs/figures/ (committed, rendered on GitHub). The rest stay
  # in data/, rebuildable and untracked.
  published_figures:
    - target_distribution
    - feature_importance
    - residual_bias
    - market_history
