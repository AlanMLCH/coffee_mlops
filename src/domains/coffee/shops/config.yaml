# What every coffee shop of the coffee domain shares: a subdomain per business, each a tenant
# of its own - its data, models, API and agent are the shop's - that reads the coffee tables
# listed in `parent` and nothing of the other shops. A shop is its file in businesses/: its
# menu, hours, staff, corner and history. Its name is the file's; this file gives it the
# rest - sources, simulation, models - so the Nth shop costs a YAML, not code.
#
# The demo shops do not exist. Their point-of-sale exports are simulated (simulate.py) and
# anchored to real data: when people buy and how they answer a price come from a real
# coffee machine's sales (`vending_sales`); what a shop pays follows green coffee in pesos
# and the consumer price index, read from the parent.

sources:
  # A real coffee machine's sales (one sale a row: day, minute, price paid, drink), from
  # March 2024. CC0, on Hugging Face; pinned to a commit so the anchors are reproducible.
  # Read for its hours, its weekdays and its price changes - never as a shop's sales.
  vending_sales:
    url: https://huggingface.co/datasets/tablegpt/CoffeeSales/resolve/ac770258c76b502de47a6a314aa95ff1dc05ef0a/index.csv
    filename: coffee_sales.csv
    refresh_hours: 8760 # a pinned commit: it will not have changed

# What a shop reads of the coffee domain, table by table: the green coffee price in pesos
# its beans follow and the consumer price index its milk, pastries and wages follow; where
# green coffee may go; and the city around it - the coffee shops listed, the AGEBs and how
# many coffee shops one like each would have, and what the roasters charge.
parent:
  domain: coffee
  tables:
    - analysis.green_coffee_in_pesos
    - clean.consumer_price_index
    - analysis.price_outlook
    - clean.coffee_shops
    - features.zones_features
    - predictions.zones_predictions
    - clean.roaster_offers
    - clean.census_zones

simulation:
  sales_pattern: vending_sales
  green_coffee: coffee.analysis.green_coffee_in_pesos
  inflation: coffee.clean.consumer_price_index
  green_indicator: other_milds # Mexico's washed Arabicas are priced among the other milds

models:
  # How many tickets an hour brings, at the menu's prices or at prices the owner weighs.
  # What an item knows is features.py: its day, its hour, the menu, and how the same
  # weekday-and-hour went its last four times. Each shop registers its own
  # (`<shop>-hourly-demand`).
  - name: hourly_demand # -> hourly_demand_features, hourly_demand_predictions
    description: >-
      How many tickets the coffee shop sells in an hour of the next given day of the week,
      from how the same weekday and hour went its last four times and the menu's prices that day, or with
      every price moved by a percent: the demand to staff and stock for. A price beyond
      any the menu has had is answered as the nearest one it had: trees do not
      extrapolate, so it does not say what a larger rise would do.
    example: {weekday: 1, hour: 8}
    items:
      table: shop_hours
      id: hour_id # 2026-03-02T08
      time: date
      period: month
    spec:
      target: tickets
      task: count
      categorical: [weekday_hour]
      numeric: [hour, weekday, price_level, slot_last, slot_mean_4w, history_price_level]
      leakage: [items, revenue_mxn, mean_minutes]
    training:
      # The shops' histories end in August 2026; the six months before are the test, the
      # rest to learn from.
      split:
        kind: temporal
        test_from: 2026-03-01
        recalibration_window: 200 # hours: two weeks open
      cv_folds: 5
      trials: 30
      seed: 42
      baseline_group: weekday_hour # each slot's mean: what staffing by habit would expect
      bootstrap_resamples: 2000
      min_probability_better: 0.95
      resample_by: date # an hour shares its day's crowd with the day's other hours
      stratify_by: weekday_hour
      min_group_size: 20
      registered_model: hourly-demand
    target_bands:
      edges: [5, 15]
      labels: ["under 5", "5 to 14", "15 or more"]

  # How long an order takes from order to ready, four times in five within a range: the
  # wait a staffing and a crowd make. What an order knows is features.py.
  - name: order_minutes # -> order_minutes_features, order_minutes_predictions
    description: >-
      How many minutes an order at the coffee shop takes from ordering to ready, and the
      range it falls in four times in five, given its day and hour, its items, the staff
      on shift and the tickets the hour brings: what a staffing would mean for the wait.
      A staffing or a crowd the shop never had in that hour is answered as the nearest it
      had.
    example: {weekday: 6, hour: 10, items: 2, baristas: 1, tickets_in_hour: 14}
    items:
      table: orders
      id: ticket_id # 20260302-0042
      time: date
      period: month
    spec:
      target: minutes
      interval: 0.8
      categorical: [weekday_hour]
      numeric: [hour, weekday, items, baristas, tickets_in_hour]
      leakage: [ready_at]
    training:
      split:
        kind: temporal
        test_from: 2026-03-01
        recalibration_window: 2000 # orders: about two weeks
      cv_folds: 5
      trials: 30
      seed: 42
      baseline_group: weekday_hour # each slot's usual wait
      bootstrap_resamples: 2000
      min_probability_better: 0.95
      resample_by: date # a day's orders share its queue
      stratify_by: weekday_hour
      min_group_size: 20
      registered_model: order-minutes
    target_bands:
      edges: [5, 10]
      labels: ["under 5", "5 to 9", "10 or more"]

# Every shop's studies (analysis.py): its prices, costs, menu and hands, and its corner of
# the city against the rest.
studies:
  scenarios: [-10, -5, 5, 10, 15, 20]
  baseline_weeks: 8
  outlook_months: 6 # one of the horizons the parent's price outlook gives: 3, 6 or 12
  menu_months: 3
  radii_m: [300, 500, 1000]
  resamples: 1000
  seed: 7
  green_outlook: coffee.analysis.price_outlook
  coffee_shops: coffee.clean.coffee_shops
  zones: coffee.features.zones_features
  zone_expectations: coffee.predictions.zones_predictions
  roaster_offers: coffee.clean.roaster_offers

# Kept from the local agent (2026-10-05): the tables the map and the studies read, not an
# owner's questions - the AGEBs' outlines, the zones model's batch scores, and the shop's
# own models' batch scores (its models answer through the prediction tool, an hour or an
# order at a time). A first evaluation found the agent querying the census for "how does
# my block compare", which the neighbourhood study answers. They stay queryable, and MCP
# offers them.
agent:
  # The three studies closest to a question are shown to the steps that choose a tool:
  # every generator tried sent "what would a 10% rise do to a day's gross profit" to the
  # demand model (one hour at a time) instead of the price scenarios. Three, of eleven: a
  # question about prices often sits between two studies.
  study_cards: 3
  # A query's result is checked against its question before it is evidence: asked what
  # other coffee shops charge, every generator answered with this shop's own prices.
  check_result: true
  hidden_tables:
    - coffee.clean.census_zones
    - coffee.predictions.zones_predictions
    - predictions.hourly_demand_predictions
    - predictions.order_minutes_predictions

# The explorer (`make explore DOMAIN=coffee/<shop>`): one shop's own data against the city.
# The title and the map's centre are the shop's (shops/__init__.py sets them from its file);
# every query runs in the shop's locked session, which reads the coffee tables listed in
# `parent` and nothing of any other shop.
explore:
  title: A coffee shop
  intro: >-
    One coffee shop's own data - its sales, prices, costs, hands and waits - and its corner
    of Mexico City, from the coffee domain's tables. The shop does not exist: its
    point-of-sale export is simulated, anchored to real data, so what it shows is how the
    owner's questions get answered, not a market.
  view: {latitude: 19.43, longitude: -99.13, zoom: 14.2, pitch: 35}
  metrics:
    - label: Tickets a day
      sql: SELECT tickets_per_day FROM analysis.price_scenarios WHERE change_pct = 0
      help: The last eight weeks' average; the line is month by month since the shop opened
      trend: >-
        SELECT sum(tickets) / count(DISTINCT date) FROM clean.shop_hours
        GROUP BY month ORDER BY month
    - label: Average ticket
      sql: >-
        SELECT sum(revenue_mxn) / sum(tickets) FROM clean.shop_hours
        WHERE date > (SELECT max(date) FROM clean.shop_hours) - INTERVAL 56 DAY
      unit: MXN
      help: Revenue over tickets, the last eight weeks; the line is month by month
      trend: >-
        SELECT sum(revenue_mxn) / sum(tickets) FROM clean.shop_hours
        GROUP BY month ORDER BY month
    - label: Gross margin
      sql: SELECT gross_margin_pct FROM analysis.inflation_impact ORDER BY month DESC LIMIT 1
      unit: "%"
      decimals: 1
      help: Revenue less what went into what was sold, waste included, the last month; before staff and rent
      trend: SELECT gross_margin_pct FROM analysis.inflation_impact ORDER BY month
    - label: Nine orders in ten ready within
      sql: >-
        SELECT quantile_cont(minutes, 0.9) FROM clean.orders
        WHERE date > (SELECT max(date) FROM clean.orders) - INTERVAL 56 DAY
      unit: min
      decimals: 1
      help: From order to ready, the last eight weeks; the owner's target is in the profile
    - label: Products to raise
      sql: SELECT count(*) FROM analysis.price_alerts WHERE status = 'raise'
      help: Products whose margin is below the one their category should keep (see the findings)
    - label: Coffee shops within 500 m
      sql: SELECT shop FROM analysis.neighbourhood WHERE measure = 'coffee shops within 500 m'
      help: >-
        The coffee domain's coffee shops around the shop, each place once (DENUE and
        OpenStreetMap, a place both list counted by DENUE's row)
  layers:
    - name: The shop
      kind: points
      description: Where the shop stands - its AGEB's centroid
      sql: SELECT name, concept, zone_id, latitude, longitude FROM analysis.profile
    - name: Coffee shops within a kilometre
      kind: points
      description: >-
        The coffee domain's coffee shops within a kilometre of the shop, and how far - each
        place once: where INEGI's DENUE and OpenStreetMap both list it, DENUE's row
      sql: >-
        SELECT s.name, s.source, s.borough, s.latitude, s.longitude,
               round(111320 * sqrt(power(s.latitude - p.latitude, 2)
                 + power(cos(radians(p.latitude)) * (s.longitude - p.longitude), 2))) AS metres
        FROM coffee.clean.coffee_shops s, analysis.profile p
        WHERE s.kind = 'coffee'
          AND NOT (s.source <> 'denue' AND coalesce(s.matched_shop_id IN (
                SELECT shop_id FROM coffee.clean.coffee_shops WHERE source = 'denue'), false))
          AND 111320 * sqrt(power(s.latitude - p.latitude, 2)
            + power(cos(radians(p.latitude)) * (s.longitude - p.longitude), 2)) <= 1000
    - name: Where coffee shops are missing, block by block
      kind: areas
      unit: coffee shops missing
      description: >-
        The coffee domain's view of the whole city: the coffee shops an AGEB like each would
        have (its zones model, which never saw the AGEB's borough) minus the ones DENUE lists;
        0 where it lists as many or more. It counts inside each AGEB: a neighbour across the
        street in the next one is not counted - see the neighbourhood finding
      areas: {table: coffee.clean.census_zones, id: zone_id, name: label, boundary: boundary}
      sql: >-
        SELECT p.zone_id, greatest(0, round(p.held_out_prediction - f.coffee_shops, 1)) AS missing,
               round(p.held_out_prediction, 1) AS expected, f.coffee_shops AS listed
        FROM coffee.predictions.zones_predictions p
        JOIN coffee.features.zones_features f USING (zone_id)
  datasets:
    - name: Sales
      description: Every line of every ticket since the shop opened.
      table: clean.sales
      measures:
        revenue_mxn: sum(line_total_mxn)
        items: sum(quantity)
        tickets: count(DISTINCT ticket_id)
      dimensions: [product, category, hour, weekday, channel, payment]
      filters: [category, channel, payment]
    - name: Open hours
      description: Every hour the shop was open, the empty ones included.
      table: clean.shop_hours
      measures:
        tickets_an_hour: avg(tickets)
        revenue_mxn: sum(revenue_mxn)
        staff_on_shift: avg(baristas)
      dimensions: [hour, weekday, month]
      filters: [weekday]
    - name: Orders and their waits
      description: Every ticket, from order to ready.
      table: clean.orders
      measures:
        median_minutes: median(minutes)
        p90_minutes: quantile_cont(minutes, 0.9)
        orders: count(*)
      dimensions: [hour, weekday, baristas, items, month]
      filters: [weekday, baristas]
    - name: What each product earned
      description: Price, what went into one (waste included) and the margin, month by month.
      table: analysis.product_margins
      measures:
        mean_margin_pct: avg(margin_pct)
        units: sum(units)
        mean_price_mxn: avg(price_mxn)
      dimensions: [month, product, category]
      filters: [category, product]
  findings:
    - title: When to raise
      text: >-
        Each product's gross margin in the last month against the one its category should
        keep: raise now, watch (it would fall below if green coffee reaches the top of its
        outlook and prices keep rising as in the last year), or fine as it is.
      sql: >-
        SELECT product, round(margin_pct, 1) AS margin_pct, target_pct,
               round(margin_at_horizon_pct, 1) AS margin_at_horizon_pct,
               round(raise_needed_pct, 1) AS raise_needed_pct, status
        FROM analysis.price_alerts
      kind: bar
      x: product
      y: margin_pct
      color: status
    - title: What a price change would do to a day
      text: >-
        Every price moved by a percent: a day's gross profit against now, by the elasticity
        the shop's own price changes give, with the range its interval allows. A range that
        straddles zero means the shop's history cannot tell; past the levels the menu has had,
        the constant elasticity is an assumption.
      sql: >-
        SELECT change_pct, round(versus_now_pct, 1) AS versus_now_pct,
               round(versus_now_low_pct, 1) AS low_pct, round(versus_now_high_pct, 1) AS high_pct,
               round(tickets_per_day) AS tickets_per_day, within_history
        FROM analysis.price_scenarios ORDER BY change_pct
      kind: line
      x: change_pct
      y: versus_now_pct
    - title: The menu, as menu engineering reads it
      text: >-
        The last three months: how much of the items each product sells against its margin
        in pesos. Stars sell and earn; plowhorses sell thin; puzzles earn but sit; dogs do
        neither.
      sql: >-
        SELECT product, round(mix_pct, 1) AS mix_pct, round(margin_mxn, 1) AS margin_mxn, class
        FROM analysis.menu_engineering
      kind: scatter
      x: mix_pct
      y: margin_mxn
      color: class
    - title: Where the hands fall short
      text: >-
        Nine orders in ten are ready within this many minutes, hour by hour, each day of the
        week (1 is Monday): where the line climbs past the owner's target, the slot has too
        few hands for its crowd - and a customer facing the queue may leave unrecorded.
      sql: >-
        SELECT hour, CAST(weekday AS VARCHAR) AS weekday, round(wait_p90_minutes, 1) AS wait_p90_minutes
        FROM analysis.staffing WHERE wait_p90_minutes IS NOT NULL ORDER BY weekday, hour
      kind: line
      x: hour
      y: wait_p90_minutes
      color: weekday
    - title: What inflation did
      text: >-
        The menu's level and the cost of the mix of products against the month the shop
        opened, in pesos of that month (deflated by INEGI's consumer price index): a real
        menu level above 1 is a rise inflation did not take back.
      sql: >-
        SELECT month, 'menu, real' AS series, round(real_price_level, 3) AS level
        FROM analysis.inflation_impact
        UNION ALL
        SELECT month, 'cost of the mix, real', round(real_cost_index, 3)
        FROM analysis.inflation_impact ORDER BY month
      kind: line
      x: month
      y: level
      color: series
    - title: Its corner of the city
      text: >-
        The shop's block against its borough's and the city's median block, from the coffee
        domain's tables. No public source says what a coffee shop charges for a drink in
        Mexico City: its prices are compared with nobody's.
      sql: >-
        SELECT measure, round(shop, 1) AS shop, round(borough, 1) AS borough,
               round(city, 1) AS city, unit
        FROM analysis.neighbourhood
      kind: table
  about: |
    **What is real.** When people buy and how they answer a price come from a real coffee
    machine's sales (CC0, on Hugging Face). What the shop pays follows the coffee domain's
    green coffee in pesos and INEGI's consumer price index. The city around it - its coffee
    shops, its blocks and how many coffee shops each would have - is the coffee domain's,
    read from the tables this shop lists and nothing else.

    **What is assumed.** The menu, its prices and recipes, the hours, the staff and their
    cost, the waste, the price changes and the owner's targets: the shop's file. **What is
    simulated**: every ticket, its items and minute, the queue - a customer who would wait
    past their patience leaves, unrecorded - the weekly purchases and the shifts.

    **The limits.** A simulated shop proves the pipeline, not a market: each study reads
    back what the simulator was given, which is how it is checked. The elasticity is the
    whole menu's, and constant past the prices the menu has had. No public source gives a
    coffee shop's drink prices in Mexico City.
  examples:
    - Which products should I raise, and by how much?
    - What would a 10% rise in every price do to a day's gross profit?
    - At which hours do nine orders in ten take longer than eight minutes?
    - How long would an order of two items take on a Saturday at ten with one barista and 14 tickets in the hour?
    - Which products are stars on the menu?

monitoring:
  drift_share: 0.5

analysis:
  min_rows: 5
  permutation_repeats: 10
  published_figures: []
