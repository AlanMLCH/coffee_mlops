    language: en
    topics: [varieties, cultivation]
    format: pdf
  - name: wcr_robusta_catalog
    title: Robusta Coffee Varieties
    publisher: World Coffee Research
    url: https://cdn2.assets-servd.host/worldcoffee-research/production/pdf/catalogEnglish/Combined/robusta-1769602236.pdf?dm=1769602236
    license: No notice in the document; cited
    language: en
    topics: [varieties, cultivation]
    format: pdf

  # --- Growing and processing -----------------------------------------------------
  - name: fao_arabica_manual
    title: Arabica coffee manual for Lao PDR
    publisher: FAO
    year: 2005
    # The FAO's own copy is HTML; this mirror serves the PDF the manual was printed as.
    url: https://laocoffee.org/wp-content/uploads/2018/06/arabica-coffee-manual-for-lao-pdr-fao-2005.pdf
    license: (c) FAO; non-commercial reproduction with attribution
    language: en
    topics: [cultivation, processing, varieties]
    format: pdf
  - name: pmc_wet_processing
    title: Microbial ecology of wet coffee processing
    publisher: Frontiers in Microbiology (PMC6863779)
    year: 2019
    # Europe PMC's REST API, because PMC itself answers a robot with a reCAPTCHA. The
    # XML is sectioned, which is better than a PDF to split into chunks.
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6863779/fullTextXML
    license: CC BY
    language: en
    topics: [processing, chemistry]
    format: jats
  - name: ijfst_postharvest_aroma
