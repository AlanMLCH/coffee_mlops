# The corpus' own vocabulary: what coffee knowledge is filed under. Metadata, not
# folders - almost no document is about one subject. The terms are what a chunk is
# tagged by, what a question is routed by, and what joins a document to the tables'
# closed vocabularies. A term matches as a whole word in its inflections ("roast" finds
# "roasting"), so a stem is written once; both spellings are listed where British and
# American differ, because the corpus has both. A topic's own name is one of its terms.
# A word with a second life outside the topic is written as the phrase the topic uses:
# "development time", not "development", which in a report on development means aid.
corpus:
  # About 300 tokens a chunk: a passage an answer can cite whole, several of which fit
  # a small model's context. A starting point, to be tuned against the retrieval eval.
  chunking:
    max_chars: 1200
    overlap_chars: 200
  topics:
    cultivation:
      description: "Growing coffee: altitude, shade, soil, pruning, pests and the harvest."
      terms: [cultivation, altitude, shade, soil, pruning, harvest, cherry, leaf rust, agroforestry, nursery, yield]
    varieties:
      description: "The plants themselves - their genetics, lineage and cup potential."
      terms: [variety, cultivar, typica, bourbon, caturra, gesha, heirloom, catimor, timor hybrid, genetics]
    processing:
      description: "Turning cherry into green coffee, and what each method does to the cup."
      terms: [processing, washed, natural, honey, semi_washed, fermentation, drying, pulping, mucilage, anaerobic, wet mill]
    roasting:
      description: "The roast - its curve, its chemistry and the flavour it develops."
      terms: [roast, roast level, development time, first crack, maillard, caramelisation, caramelization, agtron, degassing, roast profile]
    chemistry:
      description: "What is in the bean and in the cup, and what it tastes of."
      terms: [chemistry, caffeine, chlorogenic acid, trigonelline, volatile, aroma compound, lipid, sugar, acidity, extraction yield]
    cupping:
      description: "How coffee is tasted and scored: protocols, attributes and calibration."
      terms: [cupping, score, total cup points, descriptive assessment, affective assessment, attribute, protocol, calibration, flavour wheel, flavor wheel]
    brewing:
      description: "Getting the coffee out of the grounds: grind, water, ratio, method."
      terms: [brew, extraction, espresso, filter, grind, brew ratio, tds, immersion, percolation, water chemistry]
    market:
      description: "Prices, production, trade and consumption, in words rather than figures."
      terms: [market, price, differential, futures, export, import, production, consumption, market year, supply, demand]
    sustainability:
      description: "Who grows it and on what terms: livelihoods, climate, certification and waste."
      terms: [sustainability, livelihood, smallholder, climate, certification, income, gender, deforestation, living income, emission, waste, circular economy]

# Rules for the clean layer. Vocabularies are closed on purpose: an unseen label
# stops the pipeline so it gets mapped deliberately instead of guessed.
cleaning:
  # Plausible arabica growing altitude; values outside become null (1 m, 190 km, unconverted feet).
  altitude_m: [300, 3000]

  # CQI name -> PSD name. Hawaii and Puerto Rico are the whole of US production in PSD.
  country_aliases:
    "United States (Hawaii)": United States
    "United States (Puerto Rico)": United States
    "Tanzania, United Republic Of": Tanzania
    "Cote d?Ivoire": Cote d'Ivoire # already mis-encoded upstream

  # Lower-cased label -> canonical method.
  processing_methods:
    washed / wet: washed
    natural / dry: natural
    pulped natural / honey: honey
    honey,mossto: honey
    semi-washed / semi-pulped: semi_washed
    semi washed: semi_washed
    semi-lavado: semi_washed
    wet hulling: semi_washed
    other: other
    # Experimental fermentations: too few rows to stand as their own class.
    double anaerobic washed: other
    anaerobico 1000h: other
    double carbonic maceration / natural: other

  # Lower-cased label -> canonical green-bean color; null means "not recorded".
  colors:
    green: green
    greenish: green
    blue-green: blue-green
    bluish-green: blue-green
    yellow-green: yellow-green
    yellow green: yellow-green
    yellow- green: yellow-green
    yello-green: yellow-green
    yellowish: yellowish
    pale yellow: yellowish
    brownish: brownish
    browish-green: brownish
    none: null

  # What a place in DENUE's class 722515 is, read from its name. The class is
  # "cafeterias, fuentes de sodas, neverias, refresquerias y similares", and juice stands
  # alone outnumber the ice-cream parlours ten to one. Ordered: the first matching rule
  # wins, so a school tuck shop called "cafeteria escolar" is a school, and a name that
  # says coffee is a place that sells coffee whatever else it sells.
  #
  # Written before being scored against OSM's tags; the only edits after scoring were
  # spelling variants of words already here (CAFECITO, CAFFEE, KAFETA, COFFEEFY). The
  # roasters' names are the ones listed for stage 3 before this data was seen - brands
  # found only among the misses were deliberately not added, or the recall measured on
  # those same places would be inflated by construction.
  shop_kinds:
    - kind: unnamed
      pattern: '^(SIN NOMBRE.*|S/N|NINGUNO)?$'
    - kind: school
      pattern: '\b(COOPERATIVA|ESCOLAR|ESCUELA|PRIMARIA|SECUNDARIA|PREPARATORIA|KINDER|COLEGIO|JARDIN DE NINOS)\b'
    - kind: coffee
      pattern: '\b(CAF+E+\w*|KAFE\w*|COF+E+\w*|ESPRESSO|EXPRESSO|BARISTA|CAPU?CCINO|TOSTADOR\w*|STARBUCKS|CIELITO QUERIDO|PUNTA DEL CIELO|ITALIAN COFFEE|JAROCHO|BUNA|CUCURUCHO|ALMANEGRA|AVELLANEDA|QUENTIN|BOICOT)\b'
    - kind: tea
      pattern: '\b(TE|TEA|TES|TETERIA|CHAI|MATCHA)\b'
    - kind: ice_cream
      pattern: '\b(NEVERIA|NIEVES?|HELADOS?|HELADERIA|PALETERIA|PALETAS|GELATO|GELATERIA|MICHOACANA|HOLANDA|DOLPHY|YOGURT|FROZEN)\b'
    - kind: juice
      pattern: '\b(JUGOS?|JUGUERIA|LICUADOS?|AGUAS FRESCAS|SMOOTHIES?|ZUMOS?|FRUTAS|ESQUIMOS?)\b'
    - kind: soda_fountain
      pattern: '\b(FUENTES? DE SODAS|SODAS)\b'
  # OSM's own tag decides the kind of its places; the name rule is scored against it.
  osm_kinds:
    cafe: coffee
    ice_cream: ice_cream
  # The same place in both registers: points this close, names this alike, and each the
  # other's best candidate. 60 m and 0.88 kept every sampled pair a true one; see
  # analysis.kind_agreement for what the name rule scores on the places they share.
  register_match:
    radius_m: 60
    min_name_similarity: 0.88

  # The roasters' product sheets (stage 3), in Spanish. Lookup keys are lower-case and
  # accent-free. Shops add coffees every week, so these rules are open, unlike the CQI's:
  # what they do not recognise is kept as written and counted in analysis.roaster_coverage.
  roaster_sheets:
    # Every label seen on the four shops' sheets (2026-09-21), as written.
    labels:
      País: country
      Pais: country
      Estado: state
      Origen: origin
      Lugar de origen: origin
      Región: region
      Region: region
      Productor: producer
      Productora: producer
      Productores: producer
      Productoras: producer
      Finca: farm
      Fincas: farm
      Predio: farm
      Altura: altitude
      Variedad: varieties
      Variedades: varieties
      Varietal(es): varieties
      Proceso: process
      Procesos: process
      Especie: species
      Especies: species
      Puntaje SCA: sca_score
      # Almanegra's "Tostado" names the roastery, not a roast level. Read so it ends the
      # value before it: some sheets run it on ("Proceso: HoneyTostado: ...").
      Tostado: null
    countries: # as PSD names them
      mexico: Mexico
      etiopia: Ethiopia
      kenia: Kenya
      colombia: Colombia
      yemen: Yemen # PSD's name since 1991; "Yemen (Sanaa)" is the north before unification
      indonesia: Indonesia
      burundi: Burundi
      ruanda: Rwanda
      rwanda: Rwanda
      papua nueva guinea: Papua New Guinea
      nicaragua: Nicaragua
      republica del congo: Congo (Brazzaville)
      tanzania: Tanzania
      india: India
      isla de timor oriental: Timor-Leste # not in PSD: no market context, like Myanmar
    # The coffee-growing states, as SIAP names them. A bare "México" is the country; the
    # state is "Estado de México", which SIAP calls México.
    states:
      chiapas: Chiapas
      colima: Colima
      estado de mexico: México
      guerrero: Guerrero
      hidalgo: Hidalgo
      jalisco: Jalisco
      michoacan: Michoacán
      morelos: Morelos
      nayarit: Nayarit
      oaxaca: Oaxaca
      puebla: Puebla
      queretaro: Querétaro
      san luis potosi: San Luis Potosí
      tabasco: Tabasco
      veracruz: Veracruz
    home_country: Mexico
    # Tried in this order over the label, parentheses dropped; each match is removed
    # before the next, so "semi-lavado" is not also "lavado". A label naming two methods
    # ("Lavado, Natural") is a lot sold two ways: other. None at all: unclassified.
    processes:
      semi_washed: 'semi.?lavad|giling basah|trillado humedo'
      honey: 'honey|enmielad'
      natural: '\bnatural\b|\bseco\b'
      washed: '\blavad[oa]\b|\bwashed\b'
    experimental: 'macera|anaerobic|anoxic|ferment|levadura|barrel|hidronatural'
    # Spellings -> the CQI's, where it has the variety. Heirloom stays heirloom: the
    # CQI's "ethiopian heirlooms" would be wrong for a Yemeni one.
    varieties:
      tipica: typica
      tipicas: typica
      sl-28: sl28
      sl-34: sl34
      ruiru-11: ruiru 11
      mondo novo: mundo novo
      marago: maragogype
      bourbon amarillo: yellow bourbon
      heirloom cultivars: heirloom
      hibridos de timor: timor hybrid
      colombia supremo: colombia # Supremo is a screen size, not a variety
      arabica - garnica: garnica # the species written before the variety
    species:
      arabiga: arabica
      arabica: arabica
      robusta: robusta
    # A kit's price pays for a book, chocolate or honey as well; a sampler's for a box.
    bundles: '^kit|sampler'
    # Far enough from the product's other offers to be a price copied from another size:
    # the three found (2026-09-21) were exactly that. The legitimate spread between the
    # different lots one product sells as variants stays within 0.5-1.7x.
    price_outlier_ratio: 3.0

# The questions the domain asks of its data, one model each. Each gets its own tables
# (<name>_features, <name>_predictions), MLflow experiment, registered model, API route
# and studies. `spec` is what the model sees; fitted transforms (encoding, rare-category
# grouping) live in the model pipeline, learned on the training split only.
models:
  # How a lot cups: Total Cup Points from what is known before cupping.
  - name: review # -> review_features, review_predictions
    description: >-
      The Total Cup Points (0-100) a lot of green arabica would score at a CQI cupping,
      from its origin country, variety, process, altitude, moisture and defects.
    # What the API scores whenever it loads the model; it is also the docs' example.
    example: {country: Ethiopia, variety: ethiopian heirlooms, processing_method: washed, altitude_m: 1900}
    # One item is one graded lot of green coffee.
    items:
      table: coffee_reviews
      id: review_id
      # When the lot was cupped: orders the temporal split, and dates the market context
      # the lot may see (the previous market year, the latest complete at grading time).
      time: grading_date
      period: snapshot # which CQI scrape: drift and residuals are measured across it
    spec:
      target: total_cup_points
      # Dropping `country` and `variety` looked like a large win when every candidate used
      # the same fixed hyperparameters (test MAE 1.808 -> 1.560). Tuned properly, the
      # difference disappears: 1.656 against the champion's 1.648, 38% confidence. They stay.
      # See experiments/feature_ablation.py and the model card.
      categorical: [country, variety, processing_method, color]
      numeric:
        - altitude_m
        - moisture_pct
        - category_one_defects
        - category_two_defects
        - quakers
        # Market context of the origin country, market year = grading year - 1 (point in time).
        - ctx_production
        - ctx_arabica_share
        - ctx_export_share
        - ctx_domestic_consumption
      # Never features: the target is literally their sum (verified on both snapshots).
      leakage:
        [aroma, flavor, aftertaste, acidity, body, balance, uniformity, clean_cup, sweetness, overall]
    training:
      # Temporal split: train on gradings up to 2018, evaluate on 2022-2023 (the 2023 snapshot).
      split:
        kind: temporal
        test_from: 2019-01-01
        # Lots used to estimate the level shift when simulating a deployed recalibration.
        recalibration_window: 30
      cv_folds: 5 # time-ordered folds inside the training period, for tuning
      trials: 40
      seed: 42
      # The model must beat predicting each group's training mean to be promoted.
      baseline_group: country
      # Promotion needs evidence, not a better point estimate: with ~200 test rows a gap of
      # 0.1 MAE is noise. A candidate must win this share of paired bootstrap resamples.
      bootstrap_resamples: 5000
      min_probability_better: 0.95
      # Per-group metrics and how each group's weight changed between train and test.
      stratify_by: country
      min_group_size: 5
      registered_model: coffee-total-cup-points
    # Error is reported by the score ranges a buyer uses, not by deciles.
    target_bands:
      edges: [82, 85]
      labels: ["low (<82)", "mid (82-85)", "high (>=85)"]

  # What a kilo of roasted coffee costs on a Mexico City shelf (stage 3), from what its
  # shop and its sheet say. 130 of the 167 coffees are Almanegra's: read as Almanegra's
  # pricing first.
  - name: offer # -> offer_features, offer_predictions
    description: >-
      The price per kilogram, in Mexican pesos, of a roasted coffee on a Mexico City
      roaster's shelf, from the shop, the bag's size and what the coffee's sheet says:
      origin, process, variety and altitude.
    example:
      {shop: almanegra, bag_grams: 250, country: Mexico, state: Oaxaca, processing_method: washed,
       variety: typica, altitude_m: 1600}
    # One item is one coffee in one size, as a shop lists it.
    items:
      table: roaster_offers
      id: offer_id
      time: observed_on # when the catalogue was read
      period: snapshot # which read: drift across reads is stage 4
    spec:
      target: price_mxn_per_kg
      categorical: [shop, country, state, processing_method, variety, producer]
      numeric:
        - altitude_m
        - bag_grams # the size, for the discount a bigger bag gets
        - origins_n # more than one origin is a blend
        - varieties_n
        # One column per variety the catalogues list often, because a coffee that names
        # several says "multiple" and its Gesha would be invisible. The list is in
        # domains/coffee/features.py, chosen by how often each appears, never by price.
        - variety_bourbon
        - variety_caturra
        - variety_colombia
        - variety_garnica
        - variety_gesha
        - variety_heirloom
        - variety_jember
        - variety_marsellesa
        - variety_mundo_novo
        - variety_oro_azteca
        - variety_pluma_mejorado
        - variety_ruiru_11
        - variety_sarchimor
        - variety_sl28
        - variety_sl34
        - variety_typica
      # The listed price is the target times the size.
      leakage: [price_mxn]
    training:
      # The sizes of one coffee are priced together: each coffee is on one side only,
      # and the gate's bootstrap resamples coffees, not bags.
      split:
        kind: group
        column: coffee_id
        test_share: 0.25
      cv_folds: 5
      # 118 training coffees in five folds is a noisy thing to choose hyperparameters by,
      # so the folds are drawn four times over and the trial is scored on all of them.
      cv_repeats: 4
      trials: 40
      seed: 42
      # 118 training coffees cannot support the core's default search. Left to it, the
      # tuner picked a model so slow it barely left the mean (learning rate 0.011 over
      # 174 trees) and a `min_frequency` of 27, which on 381 rows grouped nearly every
      # variety and state into "infrequent" - deleting the features this model is for.
      # Narrowed after reading the chosen parameters, never the test score; the gate
      # still decides whether what comes out is worth serving.
      search_space:
        learning_rate: [0.03, 0.2]
        n_estimators: [100, 400]
        num_leaves: [4, 16]
        min_child_samples: [5, 30]
        min_frequency: [2, 10]
      # To be promoted it must beat pricing every bag at its shop's average.
      baseline_group: shop
      bootstrap_resamples: 5000
      min_probability_better: 0.95
      stratify_by: shop
      min_group_size: 5
      registered_model: coffee-price-per-kg
    # Pesos per kilogram; the median offer sits near $1,000.
    target_bands:
      edges: [800, 1200]
      labels: ["under $800/kg", "$800-1,200/kg", "over $1,200/kg"]

# Mexico's own coffee, from SIAP: which crop to read and in what unit. A different
# name or unit for the same id stops the run - it would change what the numbers mean.
production:
  crop_id: "5710000"
  crop: Café cereza # cherry, not green coffee: roughly four to five times the weight
  unit: Tonelada
  # The country whose world-market balance (PSD, in 60 kg bags of green coffee) the
  # municipal totals are set against.
  country: Mexico

# The studies every domain gets: profiles, drift, feature evidence, residuals.
analysis:
  # Groups and levels smaller than this are not reported: the numbers would be noise.
  min_rows: 5
  permutation_repeats: 10
  # Figures copied into docs/figures/ (committed, rendered on GitHub). The rest stay
  # in data/, rebuildable and untracked.
  published_figures:
    - review_target_distribution
    - review_feature_importance
    - review_residual_bias
    - offer_feature_importance
    - market_history
    - shop_kinds
    - mexico_production
    - roaster_coverage

# Coffee's own studies: which slice of the world market to summarise.
market_analysis:
  market_year: 2025
  top_countries: 10
  # The country the domestic-market view follows through time.
  spotlight_country: Mexico
  history_since: 2015
