# Domain config for coffee. Everything domain-specific that is data, not code, lives here.
# The sections the core runs (sources, documents, corpus, models, analysis) are
# validated by mlops_core.config; coffee's own (the API sources, cleaning,
# market_analysis) by domains.coffee.config.
name: coffee

sources:
  # CQI snapshot scraped in 2018 (1,311 arabica reviews, graded 2010-2018). MIT license.
  # Pinned to a commit so the download is reproducible.
  cqi_2018:
    url: https://raw.githubusercontent.com/jldbc/coffee-quality-database/e3b22b2b1e597887188b97c2ada7f745e1914ec7/data/arabica_data_cleaned.csv
    filename: arabica_data_cleaned.csv
    null_values: ["NA"] # written by R
    refresh_hours: 8760 # a pinned commit: checked once a year, and it will not have changed

  # CQI snapshot re-scraped in May 2023 (207 arabica reviews, graded 2022-2023).
  # Public Kaggle download: no token needed, 302 to a signed GCS URL.
  cqi_2023:
    url: https://www.kaggle.com/api/v1/datasets/download/fatihb/coffee-quality-data-cqi
    filename: coffee-quality-data-cqi.zip
    member: df_arabica_clean.csv
    refresh_hours: 8760 # frozen since May 2023

  # USDA PSD coffee: production, trade and stocks by country and market year.
  # Republished with each circular (June and December).
  psd_coffee:
    url: https://apps.fas.usda.gov/psdonline/downloads/psd_coffee_csv.zip
    filename: psd_coffee_csv.zip
    member: psd_coffee.csv
    refresh_hours: 24 # 2 MB; a circular can come out any day of its month

  # INEGI's 2020 geostatistical framework for Mexico City: the official borough
  # polygons, and the only way to place a coordinate in an alcaldia. Verified
  # 2026-09-20: 83 MB ZIP, layer 09mun has the 16 alcaldias, and their areas add up to
  # 1,486 km2 against the 1,495 km2 the city publishes.
  cdmx_boroughs:
    url: https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/marcogeo/889463807469/09_ciudaddemexico.zip
    filename: 09_ciudaddemexico.zip
    member: conjunto_de_datos/09mun.shp
    spatial:
      # The DBF is Latin-1. Read as UTF-8 it does not come out wrong, it fails.
      encoding: ISO-8859-1
      # MEXICO_ITRF_2008_LCC, in metres. Points arrive in WGS84, so the polygons are
      # reprojected once on the way in.
      crs: EPSG:6372
      id_column: CVEGEO # entity + municipality, e.g. 09015 is Cuauhtemoc
      name_column: NOMGEO
      expected_features: 16 # the 16 alcaldias
    refresh_hours: 8760 # 83 MB, and the 2020 framework does not change

  # SIAP's closing agricultural statistics: every crop in every municipality, the
  # definitive figures of each year (not the monthly advance), one file a year at the same
  # address but for ANIO. Verified 2026-09-21 for 2025 (35,902 rows, 314 crops) and
  # 2026-09-29 for every year 2003-2025: coffee is crop 5710000 "Café cereza" in tonnes,
  # 457 to 501 rows a year. A closed year is downloaded once; when 2026 closes, `last`
  # moves.
  siap_agricola:
    url: https://nube.agricultura.gob.mx/index.php?view=10AE434F-A2158368-A120BC5A-EDF4AFAA&ANIO={year}
    filename: Cierre_agricola_mun_{year}.csv
    years: {first: 2003, last: 2025}
    # Latin-1 every year, and nothing in the file says so. Read as UTF-8 it fails on "Otoño".
    encoding: latin-1
    # The headers changed twice (verified 2026-09-29): "Precio" until 2020, and
    # "Nomcultivo Sin Um" from 2015 to 2020. The same columns, by their name since 2021.
    renamed: {Precio: Preciomediorural, Nomcultivo Sin Um: Nomcultivo}
    # Three cells in 2021 and 2022 write a thousands comma ("10,271", "3,350.00") among
    # every other number written bare (verified 2026-09-29).
    thousands: ","
    # And two cells of 2009 (the yield of two bean fields) hold a spreadsheet's error
    # where a number would be: no value, as SIAP computed it.
    null_values: ["#¡NUM!"]
    refresh_hours: 720 # the closing statistics of a year come out once

  # Stage 4: the international price of green coffee. The World Bank's Pink Sheet, monthly
  # since 1960 in $/kg; "Coffee, Arabica" and "Coffee, Robusta" are the ICO's other mild
  # Arabicas and Robustas group indicators. Verified 2026-09-25: the file's address
  # carries an id per release, so it is found on the page each time; the page's
  # robots.txt allows it; the file host cuts a connection now and then (retried).
  world_bank_prices:
    url: https://www.worldbank.org/en/research/commodity-markets
    link: CMO-Historical-Data-Monthly\.xlsx$
    filename: CMO-Historical-Data-Monthly.xlsx
    sheet: Monthly Prices
    header_row: 4 # four rows of title and notes above it
    skip_rows: 1 # the row of units under it
    # Released monthly, so a week is soon enough to see a release. Daily asks gained
    # nothing, and on 2026-09-29 the file's host began resetting this client's
    # connections after a burst of retries (curl, same agent, still got it).
    refresh_hours: 168

  # The ICO's daily indicator prices, in US cents/lb: the current month only, one PDF
  # page (the old coffee_prices.asp answers 500 since the site moved). Each download is
  # a window, so the history is every download. Verified 2026-09-25.
  ico_prices:
    url: https://ico.org/documents/I-CIP.pdf
    filename: I-CIP.pdf

  # Stage 4: pesos per US dollar, to put green coffee in the currency the shelves charge.
  # The Federal Reserve's noon buying rate in New York (H.10 release), daily since
  # 8 November 1993, through FRED: a CSV, no key, and robots.txt allows the path.
  # Verified 2026-09-27: 8,575 business days, 336 of them empty (US holidays: no rate
  # was set); the mean of a month's days is FRED's own monthly series (EXMXUS) to four
  # decimals, 394 months of 394. Banxico's FIX is Mexico's official rate, but its API
  # takes a token, and a clean clone should build without one.
  fred_usd_mxn:
    url: https://fred.stlouisfed.org/graph/fredgraph.csv?id=DEXMXUS
    filename: DEXMXUS.csv
    refresh_hours: 20 # released weekly; checked on the daily run, early or late

  # Stage 4: what packaged coffee costs on a shop's shelf. PROFECO's "Quién es Quién en
  # los Precios": its staff price a basket of products in supermarkets, convenience
  # stores, markets and pharmacies across Mexico. A year is one ZIP of fortnightly CSVs,
  # republished every month with the month before added (metadata: monthly; the July
  # release came out on 31 August). Verified 2026-09-27: 195 MB, January-July 2026, 2.5 GB
  # unpacked, 64,451 rows of coffee; no robots.txt (404); no licence stated on the page
  # or in the metadata. The page's links are opaque tokens (file.php?t=...), so the file
  # is found by what its link says, and the page lists 2025 before 2026, so the year is
  # named: a new year is a change here.
  profeco_prices:
    url: https://datos.profeco.gob.mx/datos_abiertos/qqp.php
    link_text: ^Quien es Quien en los Precios 2026$
    filename: QQP_2026.zip
    member: QQP_2026 # the folder of fortnights: the domain's reader reads them all
    refresh_hours: 168 # a monthly release of 195 MB, not fetched every day

  # The years the survey has closed: one RAR 5 archive each, the whole year, published
  # once. Verified 2026-09-29, every fortnight of both: 24 files a year named
  # `<month>-<year>_01.csv` and `_02.csv` (not `_Q1`), UTF-8 with a mark, the fifteen
  # documented columns, every date inside its fortnight; 117,981 coffee prices in 2024
  # and 98,948 in 2025. Python has no RAR reader: the core opens it with libarchive's
  # bsdtar (Windows' and macOS's own tar; `libarchive-tools` on Linux).
  profeco_prices_2025:
    url: https://datos.profeco.gob.mx/datos_abiertos/qqp.php
    link_text: ^Quien es Quien en los Precios 2025$
    filename: QQP_2025.rar
    member: QQP_2025
    refresh_hours: 8760 # closed: asked once a year, in case it is ever corrected

  profeco_prices_2024:
    url: https://datos.profeco.gob.mx/datos_abiertos/qqp.php
    link_text: ^Quien es Quien en los Precios 2024$
    filename: QQP_2024.rar
    member: QQP_2024
    refresh_hours: 8760

  # INEGI's 2020 Census, principal results by locality (ITER), for Mexico City: who lives
  # in each alcaldia, to set the coffee shops against people as well as square
  # kilometres. A row per locality and a total row per alcaldia (LOC 0000) and for the
  # state (MUN 000); state + municipality is the polygons' CVEGEO. Verified 2026-09-29:
  # 175 KB ZIP, 666 rows by 286 columns, UTF-8 with a BOM; the state's 9,209,944 people
  # are exactly the alcaldias' sum; small localities' figures withheld as "*". robots.txt
  # allows /contenidos/programas. Licence: INEGI's terms (free use, citing it). Decennial.
  census_2020:
    url: https://www.inegi.org.mx/contenidos/programas/ccpv/2020/datosabiertos/iter/iter_09_cpv2020_csv.zip
    filename: iter_09_cpv2020_csv.zip
    member: iter_09_cpv2020/conjunto_de_datos/conjunto_de_datos_iter_09CSV20.csv
    refresh_hours: 8760 # the next census is 2030

  # A finer zone than the borough: INEGI's 2020 Census by urban AGEB (a basic
  # geostatistical area - a few dozen blocks) and by block. Verified 2026-09-30: a 13 MB
  # ZIP, one CSV of 68,941 rows x 230 columns (UTF-8 with a BOM): a total row per AGEB
  # (2,433, "Total AGEB urbana"; 9,145,632 people, the city's urban ones), its blocks, and
  # totals per borough and locality. Small figures are withheld as "*" (216 among the
  # columns read). Only the AGEB totals and the columns used are read (the domain's reader).
  census_2020_ageb:
    url: https://www.inegi.org.mx/contenidos/programas/ccpv/2020/datosabiertos/ageb_manzana/ageb_mza_urbana_09_cpv2020_csv.zip
    filename: ageb_mza_urbana_09_cpv2020_csv.zip
    member: ageb_mza_urbana_09_cpv2020/conjunto_de_datos/conjunto_de_datos_ageb_urbana_09_cpv2020.csv
    refresh_hours: 8760 # the next census is 2030

  # The urban AGEBs' polygons: another layer (09a) of the framework `cdmx_boroughs` reads,
  # downloaded as its own source so the core reads it as it reads any layer. 2,431
  # polygons, the same projection and character set as the boroughs'.
  cdmx_ageb:
    url: https://www.inegi.org.mx/contenidos/productos/prod_serv/contenidos/espanol/bvinegi/productos/geografia/marcogeo/889463807469/09_ciudaddemexico.zip
    filename: 09_ciudaddemexico.zip
    member: conjunto_de_datos/09a.shp
    spatial:
      encoding: ISO-8859-1
      crs: EPSG:6372
      id_column: CVEGEO # entity + municipality + locality + AGEB: 13 characters
      name_column: CVE_AGEB # an AGEB has a code, no name
      expected_features: 2431
    refresh_hours: 8760

  # INEGI's 2025 Intercensal Survey, principal results: the same questions as the census
  # and more (age, work, commute, housing tenure), asked in October-November 2025 of a
  # sample of 7.3 million dwellings, representative of every municipality - each alcaldia
  # included. Published 22 September 2026; found through the survey page's own metadata.
  # Verified 2026-09-30: an 8.3 MB ZIP, one CSV of 13,880 rows x 349 columns for the whole
  # country, Windows-1252; a row per area and estimator (the value, its standard error,
  # the 90% interval's limits and the coefficient of variation); "MI" where the sample was
  # too small (never in Mexico City) and "NA" where a figure does not apply. The sixteen
  # alcaldias add up to the city's own totals exactly. Licence: INEGI's terms (free use,
  # citing it).
  intercensal_2025:
    url: https://www.inegi.org.mx/contenidos/programas/eic/2025/datosabiertos/conjunto_de_datos_eic2025_105_csv.zip
    filename: conjunto_de_datos_eic2025_105_csv.zip
    member: conjunto_de_datos/conjunto_datos_eic2025_105.csv
    encoding: cp1252
    null_values: ["MI", "NA"]
    refresh_hours: 8760 # the next survey is the 2030 census

  # Where people pass: Mexico City's open-data portal (CKAN). Its robots.txt forbids /api/
  # and asks ten seconds between requests, so the three files are fetched by their
  # download addresses, ten seconds apart. CC-BY-4.0 (Mexico City's), each. Verified
  # 2026-09-29/30 with the project's client.
  # The Metro's entries per station and day since 2010 ("Afluencia Diaria del Metro
  # (Simple)"): 60 MB, 1,180,920 rows, the 195 station-lines every day. Republished
  # monthly with the month before added (the portal warns history may be revised).
  metro_ridership:
    url: https://datos.cdmx.gob.mx/dataset/f2046fd5-51b5-4876-b008-bd65d95f9a02/resource/0e8ffe58-28bb-4dde-afcd-e5f5b4de4ccb/download/0e8ffe58-28bb-4dde-afcd-e5f5b4de4ccb.csv
    filename: afluencia_diaria_metro.csv
    crawl_delay: 10
    refresh_hours: 720 # a monthly release
  # The Metrobús' entries per line and day since July 2005: per line only, never per
  # station. 2 MB; "NaN" for the days before a line opened.
  metrobus_ridership:
    url: https://datos.cdmx.gob.mx/dataset/f0ff3759-5c5d-41fb-80cc-2a3c8bbab278/resource/f7943c47-835d-4078-93ea-906f64b72f3b/download/f7943c47-835d-4078-93ea-906f64b72f3b.csv
    filename: afluencia_diaria_metrobus.csv
    null_values: ["NaN"]
    crawl_delay: 10
    refresh_hours: 720
  # The city's static GTFS feed (2.4 MB ZIP, every system); its stops are read for the
  # Metro's and the Metrobús' stations. A stop id names the system and the line.
  transit_stops:
    url: https://datos.cdmx.gob.mx/dataset/75538d96-3ade-4bc5-ae7d-d85595e4522d/resource/32ed1b6b-41cd-49b3-b7f0-b57acb0eb819/download/32ed1b6b-41cd-49b3-b7f0-b57acb0eb819.zip
    filename: gtfs.zip
    member: stops.txt
    crawl_delay: 10
    refresh_hours: 720

  # What farmers are paid for their coffee, country by country, year by year: FAOSTAT's
  # producer prices, one bulk file for every crop. Verified 2026-09-29: 11.7 MB ZIP whose
  # CSV is 214 MB unpacked (1.3 million rows, UTF-8, every field quoted); "Coffee, green"
  # (item 656) is 6,291 rows, 59 countries, 1991-2025, in local currency, the local
  # currency before a redenomination, US dollars (1991-2024, 52 countries) and an index
  # (2014-2016 = 100); annual values and, for some countries, months. Licence CC BY 4.0
  # (FAO's statistical data): cite FAO, the dataset and the date it was read. The bulk
  # server has no robots.txt (403).
  faostat_prices:
    url: https://bulks-faostat.fao.org/production/Prices_E_All_Data_(Normalized).zip
    filename: Prices_E_All_Data_(Normalized).zip
    member: Prices_E_All_Data_(Normalized).csv
    refresh_hours: 720 # revised once or twice a year

  # What households spend on coffee to drink at home: INEGI's 2024 household income and
  # expenditure survey (ENIGH, new series), representative of every state - not of an
  # alcaldia. Microdata, a ZIP per table, verified 2026-10-01 with the project's client.
  # Purchases: every one the 91,414 households of the sample reported (5.3 million rows;
  # the domain's reader keeps the coffee codes). Households: one row each, with its weight.
  # Licence: INEGI's terms (free use, citing it).
  enigh_2024_spending:
    url: https://www.inegi.org.mx/contenidos/programas/enigh/nc/2024/microdatos/enigh2024_ns_gastoshogar_csv.zip
    filename: enigh2024_ns_gastoshogar_csv.zip
    member: gastoshogar.csv
    refresh_hours: 8760 # the next survey is 2026's, published in 2027
  enigh_2024_households:
    url: https://www.inegi.org.mx/contenidos/programas/enigh/nc/2024/microdatos/enigh2024_ns_concentradohogar_csv.zip
    filename: enigh2024_ns_concentradohogar_csv.zip
    member: concentradohogar.csv
    refresh_hours: 8760

  # Cup of Excellence Mexico: each year's best lots, judged blind by a national and an
  # international jury, and what an online auction paid for them - the Alliance for
  # Coffee Excellence's page for the year, read by the domain (`sources/coe.py`).
  # robots.txt allows every agent and asks no delay; two seconds between pages anyway.
  # Verified 2026-10-01: the site's own list of Mexico's competitions has no 2016 or 2020.
  # The pages say "© Alliance for Coffee Excellence. All Rights Reserved": kept in the
  # raw layer like any download, never committed or republished.
  cup_of_excellence:
    url: https://allianceforcoffeeexcellence.org/mexico-{year}/
    filename: mexico-{year}.html
    years: {first: 2012, last: 2026, missing: [2016, 2020]}
    crawl_delay: 2
    refresh_hours: 720 # a closed year is read once; the year in course monthly

# Raw sources whose history is every download, not the latest (stage 4): the ICO's page
# shows only the current month, each read of the roasters' catalogues is an observation
# of what they sold then, and PROFECO's archive holds only the current year - when 2027's
# replaces it, 2026's fortnights must stay. The two registers of places, because what
# each lists is what exists then: a place a later read leaves out is gone from it. Every
# download is kept (raw is never pruned).
accumulate: [ico_prices, roaster_catalogs, profeco_prices, denue_cafes, osm_places]

# Stage 2, token required (COFFEE_DENUE_TOKEN). Verified against the live API on
# 2026-09-20: class 722515 has 9,860 establishments in Mexico City.
denue:
  name: denue_cafes
  base_url: https://www.inegi.org.mx/app/api/denue/v1/consulta
  entity: "09" # Mexico City
  # "Cafeterías, fuentes de sodas, neverías, refresquerías y similares": the class is
  # wider than coffee, so the whole class is kept and flagged during cleaning.
  activity_class: "722515"
  page_size: 100 # the service's own page size
  filename: denue_cafes.json
  # A free public service: one request every second is plenty for 99 pages.
  rate_limit_seconds: 1.0
  # Re-runs within a day replay from disk; the next day asks again. The register is
  # updated a few times a year, so a day costs nothing and a forever cache costs truth.
  cache_hours: 24
  # Where people work, not only where they live: every establishment of every activity
  # in each alcaldia, counted per staff-size stratum by `Cuantificar` with activity 0
  # (verified 2026-09-29: a count for every SCIAN level, and the strata match the
  # records' own staff bands). 16 alcaldias x 7 strata = 112 requests, same token.
  workplaces:
    name: denue_workplaces
    filename: denue_workplaces.json
    areas: ["09002", "09003", "09004", "09005", "09006", "09007", "09008", "09009",
            "09010", "09011", "09012", "09013", "09014", "09015", "09016", "09017"]

# Stage 2, no credential. Verified against the live API on 2026-09-21: 1,125 elements
# tagged amenity=cafe in Mexico City (1,031 nodes, 94 ways, 0 relations) and 232 tagged
# amenity=ice_cream. The ice-cream parlours are pulled because DENUE's class counts them
# too: OSM's tag is the independent evidence the name rule below is scored against.
overpass:
  name: osm_places
  base_url: https://overpass-api.de/api/interpreter
  area_iso: MX-CMX # ISO 3166-2 code of Mexico City
  amenities: [cafe, ice_cream]
  filename: osm_places.json
  # Overpass' own budget, deliberately under the client's 60 s read timeout: when the
  # query is too big we want the server's explanation, not a bare client timeout.
  timeout_s: 50
  # A volunteer-run instance with a fair-use policy (it answered 429 twice while this
  # source was being verified). One query per run, and the client retries a 429.
  rate_limit_seconds: 2.0
  cache_hours: 24 # OSM changes by the minute; a day is fresh enough for a density

# Stage 2, key required (COFFEE_USDA_FAS_API_KEY, sent as the X-Api-Key header). The
# same PSD balance as `psd_coffee`, reached through an API: verified on 2026-09-21 to
# return the same 87,704 rows, key for key and value for value. The file stays the
# source of `market_context` (no key, one request); this one is audited against it.
fas:
  name: fas_psd_coffee
  base_url: https://api.fas.usda.gov/api/psd
  commodity_code: "0711100" # Coffee, Green
  first_year: 1960 # the first market year PSD has for coffee
  filename: fas_psd_coffee.json
  # 1,000 requests per hour per key; a full pull is ~70, so a second apart is generous.
  rate_limit_seconds: 1.0
  # Recent market years are revised with each circular; a day keeps up with that.
  cache_hours: 24

# Stage 4, token required (COFFEE_INPC_TOKEN): INEGI's indicators API, for the national
# consumer price index - what turns a peso of 2003 into a peso of today. Verified
# 2026-10-01: the token rides in the path, like DENUE's; the bank is "BIE-BISE" (BIE and
# BISE answer "no results") and the country is area "00" (the documented "0700" answers
# "no results" too). 910392 is "Índice general" of the INPC as INEGI updated it in 2024 (base:
# second half of July 2018 = 100), monthly since January 1969, last update 9 Sep 2026
# with August's; 628194, the id most references give, is the series before that update,
# which stops in July 2024.
inpc:
  name: inpc
  base_url: https://www.inegi.org.mx/app/api/indicadores/desarrolladores/jsonxml
  indicator: "910392"
  source: BIE-BISE
  area: "00"
  filename: inpc.json
  rate_limit_seconds: 1.0
  cache_hours: 24 # published monthly; a day keeps up with it

# Stage 3, no credential: Mexico City's specialty roasters, read from their own shops'
# catalogs. Verified 2026-09-21: robots.txt allows this project's agent on all four, and
# none asks for a Crawl-delay. What each shop needs to be read right is data, below.
roasters:
  name: roaster_catalogs
  filename: roaster_catalogs.json
  rate_limit_seconds: 3.0
  cache_hours: 24
  shops:
    - shop: almanegra
      platform: shopify
      base_url: https://almanegra.cafe
      product_types: [Coffee] # 130 of its 284 listings; the rest is gear and merch
    - shop: buna
      platform: shopify
      base_url: https://buna.mx
      tags: ["Café"] # product_type is mostly empty; the tag is not
      # Region, altitude, varieties and process are on the product page, not in the JSON.
      product_pages: true
    - shop: jiribilla
      platform: shopify
      base_url: https://cafeconjiribilla.com # Café con Jiribilla sells only coffee
    - shop: cucurucho
      platform: squarespace
      base_url: https://cucuruchocafe.com
      store_path: /tienda
      # The store page lists merch and subscriptions beside the coffee, untagged.
      exclude_titles: ["^tote", "^playera", "chamarra", "^suscripci", "^taza"]

# What the agent explains from (stage 3). Text, never figures: a PDF's tables come out of
# extraction scrambled, so numbers are answered from the tables with SQL. Every chunk
# carries this metadata, so an answer can say who published it, when and under what licence.
# Verified 2026-09-21: each one downloaded and its text read.
documents:
  # --- Varieties ------------------------------------------------------------------
  - name: wcr_arabica_catalog
    title: Arabica Coffee Varieties
    publisher: World Coffee Research
    url: https://cdn2.assets-servd.host/worldcoffee-research/production/pdf/catalogEnglish/Combined/arabica-1769602235.pdf?dm=1769602235
    license: No notice in the document; cited
    language: en
    topics: [varieties, cultivation]
    format: pdf
  - name: wcr_robusta_catalog
    title: Robusta Coffee Varieties
    publisher: World Coffee Research
    url: https://cdn2.assets-servd.host/worldcoffee-research/production/pdf/catalogEnglish/Combined/robusta-1769602236.pdf?dm=1769602236
    license: No notice in the document; cited
    language: en
    topics: [varieties, cultivation]
    format: pdf

  # --- Growing and processing -----------------------------------------------------
  - name: fao_arabica_manual
    title: Arabica coffee manual for Lao PDR
    publisher: FAO
    year: 2005
    # The FAO's own copy is HTML; this mirror serves the PDF the manual was printed as.
    url: https://laocoffee.org/wp-content/uploads/2018/06/arabica-coffee-manual-for-lao-pdr-fao-2005.pdf
    license: (c) FAO; non-commercial reproduction with attribution
    language: en
    topics: [cultivation, processing, varieties]
    format: pdf
  - name: pmc_wet_processing
    title: Microbial ecology of wet coffee processing
    publisher: Frontiers in Microbiology (PMC6863779)
