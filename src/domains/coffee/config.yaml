# The corpus' own vocabulary: what coffee knowledge is filed under. Metadata, not
# folders - almost no document is about one subject. The terms are what a chunk is
# tagged by, what a question is routed by, and what joins a document to the tables'
# closed vocabularies. A term matches as a whole word in its inflections ("roast" finds
# "roasting"), so a stem is written once; both spellings are listed where British and
# American differ, because the corpus has both. A topic's own name is one of its terms.
# A word with a second life outside the topic is written as the phrase the topic uses:
# "development time", not "development", which in a report on development means aid.
corpus:
  # About 300 tokens a chunk: a passage an answer can cite whole, several of which fit
  # a small model's context. A starting point, to be tuned against the retrieval eval.
  chunking:
    max_chars: 1200
    overlap_chars: 200
  # Papers and catalogues are revised rarely, and the corpus weighs 62 MB: a scheduled
  # daily run fetches it again once a month.
  refresh_hours: 720
  topics:
    cultivation:
      description: "Growing coffee: altitude, shade, soil, pruning, pests and the harvest."
      terms: [cultivation, altitude, shade, soil, pruning, harvest, cherry, leaf rust, agroforestry, nursery, yield]
    varieties:
      description: "The plants themselves - their genetics, lineage and cup potential."
      terms: [variety, cultivar, typica, bourbon, caturra, gesha, heirloom, catimor, timor hybrid, genetics]
    processing:
      description: "Turning cherry into green coffee, and what each method does to the cup."
      terms: [processing, washed, natural, honey, semi_washed, fermentation, drying, pulping, mucilage, anaerobic, wet mill]
    roasting:
      description: "The roast - its curve, its chemistry and the flavour it develops."
      terms: [roast, roast level, development time, first crack, maillard, caramelisation, caramelization, agtron, degassing, roast profile]
    chemistry:
      description: "What is in the bean and in the cup, and what it tastes of."
      terms: [chemistry, caffeine, chlorogenic acid, trigonelline, volatile, aroma compound, lipid, sugar, acidity, extraction yield]
    cupping:
      description: "How coffee is tasted and scored: protocols, attributes and calibration."
      terms: [cupping, score, total cup points, descriptive assessment, affective assessment, attribute, protocol, calibration, flavour wheel, flavor wheel]
    brewing:
      description: "Getting the coffee out of the grounds: grind, water, ratio, method."
      terms: [brew, extraction, espresso, filter, grind, brew ratio, tds, immersion, percolation, water chemistry]
    market:
      description: "Prices, production, trade and consumption, in words rather than figures."
      terms: [market, price, differential, futures, export, import, production, consumption, market year, supply, demand]
    sustainability:
      description: "Who grows it and on what terms: livelihoods, climate, certification and waste."
      terms: [sustainability, livelihood, smallholder, climate, certification, income, gender, deforestation, living income, emission, waste, circular economy]

# Rules for the clean layer. Vocabularies are closed on purpose: an unseen label
# stops the pipeline so it gets mapped deliberately instead of guessed.
cleaning:
  # Plausible arabica growing altitude; values outside become null (1 m, 190 km, unconverted feet).
  altitude_m: [300, 3000]

  # CQI name -> PSD name. Hawaii and Puerto Rico are the whole of US production in PSD.
  country_aliases:
    "United States (Hawaii)": United States
    "United States (Puerto Rico)": United States
    "Tanzania, United Republic Of": Tanzania
    "Cote d?Ivoire": Cote d'Ivoire # already mis-encoded upstream

  # Lower-cased label -> canonical method.
  processing_methods:
    washed / wet: washed
    natural / dry: natural
    pulped natural / honey: honey
    honey,mossto: honey
    semi-washed / semi-pulped: semi_washed
    semi washed: semi_washed
    semi-lavado: semi_washed
    wet hulling: semi_washed
    other: other
    # Experimental fermentations: too few rows to stand as their own class.
    double anaerobic washed: other
    anaerobico 1000h: other
    double carbonic maceration / natural: other

  # Lower-cased label -> canonical green-bean color; null means "not recorded".
  colors:
    green: green
    greenish: green
    blue-green: blue-green
    bluish-green: blue-green
    yellow-green: yellow-green
    yellow green: yellow-green
    yellow- green: yellow-green
    yello-green: yellow-green
    yellowish: yellowish
    pale yellow: yellowish
    brownish: brownish
    browish-green: brownish
    none: null

  # What a place in DENUE's class 722515 is, read from its name. The class is
  # "cafeterias, fuentes de sodas, neverias, refresquerias y similares", and juice stands
  # alone outnumber the ice-cream parlours ten to one. Ordered: the first matching rule
  # wins, so a school tuck shop called "cafeteria escolar" is a school, and a name that
  # says coffee is a place that sells coffee whatever else it sells.
  #
  # Written before being scored against OSM's tags; the only edits after scoring were
  # spelling variants of words already here (CAFECITO, CAFFEE, KAFETA, COFFEEFY). The
  # roasters' names are the ones listed for stage 3 before this data was seen - brands
  # found only among the misses were deliberately not added, or the recall measured on
  # those same places would be inflated by construction.
  shop_kinds:
    - kind: unnamed
      pattern: '^(SIN NOMBRE.*|S/N|NINGUNO)?$'
    - kind: school
      pattern: '\b(COOPERATIVA|ESCOLAR|ESCUELA|PRIMARIA|SECUNDARIA|PREPARATORIA|KINDER|COLEGIO|JARDIN DE NINOS)\b'
    - kind: coffee
      pattern: '\b(CAF+E+\w*|KAFE\w*|COF+E+\w*|ESPRESSO|EXPRESSO|BARISTA|CAPU?CCINO|TOSTADOR\w*|STARBUCKS|CIELITO QUERIDO|PUNTA DEL CIELO|ITALIAN COFFEE|JAROCHO|BUNA|CUCURUCHO|ALMANEGRA|AVELLANEDA|QUENTIN|BOICOT)\b'
    - kind: tea
      pattern: '\b(TE|TEA|TES|TETERIA|CHAI|MATCHA)\b'
    - kind: ice_cream
      pattern: '\b(NEVERIA|NIEVES?|HELADOS?|HELADERIA|PALETERIA|PALETAS|GELATO|GELATERIA|MICHOACANA|HOLANDA|DOLPHY|YOGURT|FROZEN)\b'
    - kind: juice
      pattern: '\b(JUGOS?|JUGUERIA|LICUADOS?|AGUAS FRESCAS|SMOOTHIES?|ZUMOS?|FRUTAS|ESQUIMOS?)\b'
    - kind: soda_fountain
      pattern: '\b(FUENTES? DE SODAS|SODAS)\b'
  # OSM's own tag decides the kind of its places; the name rule is scored against it.
  osm_kinds:
    cafe: coffee
    ice_cream: ice_cream
  # The same place in both registers: points this close, names this alike, and each the
  # other's best candidate. 60 m and 0.88 kept every sampled pair a true one; see
  # analysis.kind_agreement for what the name rule scores on the places they share.
  register_match:
    radius_m: 60
    min_name_similarity: 0.88

  # The roasters' product sheets (stage 3), in Spanish. Lookup keys are lower-case and
  # accent-free. Shops add coffees every week, so these rules are open, unlike the CQI's:
  # what they do not recognise is kept as written and counted in analysis.roaster_coverage.
  roaster_sheets:
    # Every label seen on the four shops' sheets (2026-09-21), as written.
    labels:
      País: country
      Pais: country
      Estado: state
      Origen: origin
      Lugar de origen: origin
      Región: region
      Region: region
      Productor: producer
      Productora: producer
      Productores: producer
      Productoras: producer
      Finca: farm
      Fincas: farm
      Predio: farm
      Altura: altitude
      Variedad: varieties
      Variedades: varieties
      Varietal(es): varieties
      Proceso: process
      Procesos: process
      Especie: species
      Especies: species
      Puntaje SCA: sca_score
      # Almanegra's "Tostado" names the roastery, not a roast level. Read so it ends the
      # value before it: some sheets run it on ("Proceso: HoneyTostado: ...").
      Tostado: null
    countries: # as PSD names them
      mexico: Mexico
      etiopia: Ethiopia
      kenia: Kenya
      colombia: Colombia
      yemen: Yemen # PSD's name since 1991; "Yemen (Sanaa)" is the north before unification
      indonesia: Indonesia
      burundi: Burundi
      ruanda: Rwanda
      rwanda: Rwanda
      papua nueva guinea: Papua New Guinea
      nicaragua: Nicaragua
      republica del congo: Congo (Brazzaville)
      tanzania: Tanzania
      india: India
      isla de timor oriental: Timor-Leste # not in PSD: no market context, like Myanmar
    # The coffee-growing states, as SIAP names them. A bare "México" is the country; the
    # state is "Estado de México", which SIAP calls México.
    states:
      chiapas: Chiapas
      colima: Colima
      estado de mexico: México
      guerrero: Guerrero
      hidalgo: Hidalgo
      jalisco: Jalisco
      michoacan: Michoacán
      morelos: Morelos
      nayarit: Nayarit
      oaxaca: Oaxaca
      puebla: Puebla
      queretaro: Querétaro
      san luis potosi: San Luis Potosí
      tabasco: Tabasco
      veracruz: Veracruz
    home_country: Mexico
    # Tried in this order over the label, parentheses dropped; each match is removed
    # before the next, so "semi-lavado" is not also "lavado". A label naming two methods
    # ("Lavado, Natural") is a lot sold two ways: other. None at all: unclassified.
    processes:
      semi_washed: 'semi.?lavad|semi.?washed|giling basah|trillado humedo'
      honey: 'honey|enmielad'
      natural: '\bnatural\b|\bseco\b'
      washed: '\blavad[oa]\b|\bwashed\b'
    experimental: 'macera|anaerobic|anoxic|ferment|levadura|barrel|hidronatural|exp?erimental'
    # Spellings -> the CQI's, where it has the variety. Heirloom stays heirloom: the
    # CQI's "ethiopian heirlooms" would be wrong for a Yemeni one.
    varieties:
      tipica: typica
      tipicas: typica
      sl-28: sl28
      sl-34: sl34
      ruiru-11: ruiru 11
      mondo novo: mundo novo
      marago: maragogype
      bourbon amarillo: yellow bourbon
      heirloom cultivars: heirloom
      hibridos de timor: timor hybrid
      colombia supremo: colombia # Supremo is a screen size, not a variety
      arabica - garnica: garnica # the species written before the variety
    species:
      arabiga: arabica
      arabica: arabica
      robusta: robusta
    # A kit's price pays for a book, chocolate or honey as well; a sampler's for a box.
    bundles: '^kit|sampler'
    # Far enough from the product's other offers to be a price copied from another size:
    # the three found (2026-09-21) were exactly that. The legitimate spread between the
    # different lots one product sells as variants stays within 0.5-1.7x.
    price_outlier_ratio: 3.0

  # The tasting notes in a roaster's description, read into the flavour categories of
  # the SCA's descriptive assessment (SCA-103, the CATA form; in the corpus): Floral;
  # Fruity (Berry, Dried Fruit, Citrus Fruit); Sour/Fermented; Green/Vegetative; Other
  # (Musty/Earthy, Woody); Roasted (Cereal, Burnt, Tobacco); Nutty/Cocoa; Spice; Sweet
  # (Vanilla, Brown Sugar). A note the form has no subcategory for gets none. Where the
  # form is silent, the SCA's flavour wheel places it: black tea is floral, leather is
  # musty. Words are written as the shops write them; matching drops accents and case,
  # and accepts the plural and the other gender.
  tasting_notes:
    cues: [notas, nota, sabe, saben, sabor, sabores, aroma, aromas, fragancia, fragancias,
      recuerda, recuerdan, recordando, matices, toque, toques, dejos, tonos, posgusto,
      regusto, retrogusto, final, perfil, evoca, evocan, "en taza", "en boca", "en nariz"]
    negations: [sin, ni, "no", nunca]
    title_notes: [cucurucho]
    other_meanings:
      - 'cerezas? (?:de cafe|maduras)' # the fruit that is picked
      - 'de (?:la|las) cerezas?'
      - 'seleccion de (?:las )?cerezas'
      - 'con (?:toda )?(?:su|la) fruta' # dried with its fruit on: a natural process
      - 'proceso (?:de )?miel' # the honey process
    groups:
      - category: floral
        notes: {floral: floral, flor: flowers, jazmín: jasmine,
          azahar: orange blossom, rosa: rose, lavanda: lavender, hibisco: hibiscus,
          jamaica: hibiscus, manzanilla: chamomile, bergamota: bergamot,
          madreselva: honeysuckle, fresia: freesia, "té negro": black tea,
          "té de jazmín": jasmine tea, rooibos: rooibos, verbena: verbena}
      - category: fruity
        subcategory: berry
        notes: {fruto rojo: red berries, fruto del bosque: forest berries,
          fruto negro: black berries, baya: berries, frambuesa: raspberry,
          "tarta de frambuesa": raspberry tart, fresa: strawberry, zarzamora: blackberry,
          mora: blackberry, arándano: blueberry, grosella: currant}
      - category: fruity
        subcategory: dried_fruit
        notes: {pasas: raisins, "uva pasa": raisin, "ciruela pasa": prune, dátil: date,
          higo: fig, orejón: dried apricot, fruta deshidratada: dried fruit,
          fruta seca: dried fruit, durazno seco: dried peach, durazno deshidratado: dried peach}
      - category: fruity
        subcategory: citrus_fruit
        notes: {cítrico: citrus, limón: lemon, lima: lime, naranja: orange,
          "naranja roja": blood orange, "cáscara de naranja": orange peel,
          "cáscara de cítricos": citrus peel, mandarina: tangerine, toronja: grapefruit,
          pomelo: grapefruit, yuzu: yuzu, kumquat: kumquat}
      - category: fruity
        notes: {fruta: fruit, frutal: fruity, afrutado: fruity, "fruta madura": ripe fruit,
          "fruta cocida": cooked fruit, tropical: tropical fruit, fruto amarillo: yellow fruit,
          fruta amarilla: yellow fruit, fruta de hueso: stone fruit,
          fruta con hueso: stone fruit, fruto de hueso: stone fruit, durazno: peach,
          melocotón: peach, nectarina: nectarine, chabacano: apricot, albaricoque: apricot,
          ciruela: plum, cereza: cherry, manzana: apple, pera: pear, uva: grape,
          moscatel: muscat grape, piña: pineapple, mango: mango, papaya: papaya,
          guanábana: soursop, chirimoya: cherimoya, maracuyá: passion fruit, guayaba: guava,
          carambolo: star fruit, melón: melon, sandía: watermelon, kiwi: kiwi, lichi: lychee,
          granada: pomegranate, tamarindo: tamarind, plátano: banana, coco: coconut,
          mermelada: jam}
      - category: sour_fermented
        notes: {fermentado: fermented, vinoso: winey, vino: wine, "vino tinto": red wine,
          "vino blanco": white wine, licor: liquor, licoroso: boozy, whisky: whisky, ron: rum,
          brandy: brandy, mezcal: mezcal, sidra: cider, kombucha: kombucha, acético: acetic}
      - category: green_vegetative
        notes: {herbal: herbal, hierba: herbs, vegetal: vegetal, pasto: grass,
          "té verde": green tea, matcha: matcha, "hoja de naranja": orange leaf,
          hierbabuena: spearmint, menta: mint, eucalipto: eucalyptus, ruda: rue}
      - category: other
        subcategory: musty_earthy
        notes: {terroso: earthy, "tierra mojada": wet earth, cuero: leather}
      - category: other
        subcategory: woody
        notes: {madera: wood, amaderado: woody, cedro: cedar, roble: oak, sándalo: sandalwood,
          incienso: incense}
      - category: roasted
        subcategory: cereal
        notes: {cereal: cereal, malta: malt, cebada: barley, pan: bread,
          "pan tostado": toast, galleta: biscuit}
      - category: roasted
        subcategory: burnt
        notes: {tostado: roasted, ahumado: smoky}
      - category: roasted
        subcategory: tobacco
        notes: {tabaco: tobacco}
      - category: nutty_cocoa
        subcategory: nutty
        notes: {nuez: walnut, nueces: walnut, "nuez de castilla": walnut,
          "nuez pecana": pecan, almendra: almond, avellana: hazelnut, cacahuate: peanut,
          fruto seco: nuts, pistache: pistachio, macadamia: macadamia, sésamo: sesame,
          ajonjolí: sesame, praliné: praline}
      - category: nutty_cocoa
        subcategory: cocoa
        notes: {chocolate: chocolate, "chocolate oscuro": dark chocolate,
          "chocolate amargo": dark chocolate, "chocolate semi-amargo": dark chocolate,
          "chocolate con leche": milk chocolate, "chocolate blanco": white chocolate,
          chocolatoso: chocolatey, cacao: cocoa, cocoa: cocoa, "nibs de cacao": cacao nibs,
          brownie: brownie}
      - category: spice
        notes: {especia: spices, especiado: spiced, canela: cinnamon,
          clavo: clove, pimienta: pepper, cardamomo: cardamom, anís: anise, hinojo: fennel,
          jengibre: ginger, "nuez moscada": nutmeg, macis: mace, regaliz: liquorice,
          comino: cumin, azafrán: saffron}
      - category: sweet
        subcategory: vanilla
        notes: {vainilla: vanilla}
      - category: sweet
        subcategory: brown_sugar
        notes: {azúcar: sugar, "azúcar morena": brown sugar, "azúcar mascabado": muscovado,
          "azúcar de caña": cane sugar, "azúcar cruda": raw sugar,
          "azúcar rústico": raw sugar, "azúcar quemado": burnt sugar, panela: panela,
          piloncillo: piloncillo, melaza: molasses, caramelo: caramel,
          caramelizado: caramelised, acaramelado: caramelised, miel: honey, maple: maple,
          toffee: toffee, butterscotch: butterscotch}
      - category: sweet
        notes: {jarabe: syrup, almíbar: syrup, "dulce de leche": dulce de leche,
          cajeta: cajeta, mazapán: marzipan}

# The questions the domain asks of its data, one model each. Each gets its own tables
# (<name>_features, <name>_predictions), MLflow experiment, registered model, API route
# and studies. `spec` is what the model sees; fitted transforms (encoding, rare-category
# grouping) live in the model pipeline, learned on the training split only.
models:
  # How a lot cups: Total Cup Points from what is known before cupping.
  - name: review # -> review_features, review_predictions
    description: >-
      The Total Cup Points (0-100) a lot of green arabica would score at a CQI cupping,
      from its origin country, variety, process, altitude, moisture and defects.
    # What the API scores whenever it loads the model; it is also the docs' example.
    example: {country: Ethiopia, variety: ethiopian heirlooms, processing_method: washed, altitude_m: 1900}
    # One item is one graded lot of green coffee.
    items:
      table: coffee_reviews
      id: review_id
      # When the lot was cupped: orders the temporal split, and dates the market context
      # the lot may see (the previous market year, the latest complete at grading time).
      time: grading_date
      period: snapshot # which CQI scrape: drift and residuals are measured across it
    spec:
      target: total_cup_points
      # Dropping `country` and `variety` looked like a large win when every candidate used
      # the same fixed hyperparameters (test MAE 1.808 -> 1.560). Tuned properly, the
      # difference disappears: 1.656 against the champion's 1.648, 38% confidence. They stay.
      # See experiments/feature_ablation.py and the model card.
      categorical: [country, variety, processing_method, color]
      numeric:
        - altitude_m
        - moisture_pct
        - category_one_defects
        - category_two_defects
        - quakers
        # Market context of the origin country, market year = grading year - 1 (point in time).
        - ctx_production
        - ctx_arabica_share
        - ctx_export_share
        - ctx_domestic_consumption
      # Never features: the target is literally their sum (verified on both snapshots).
      leakage:
        [aroma, flavor, aftertaste, acidity, body, balance, uniformity, clean_cup, sweetness, overall]
    training:
      # Temporal split: train on gradings up to 2018, evaluate on 2022-2023 (the 2023 snapshot).
      split:
        kind: temporal
        test_from: 2019-01-01
        # Lots used to estimate the level shift when simulating a deployed recalibration.
        recalibration_window: 30
      cv_folds: 5 # time-ordered folds inside the training period, for tuning
      trials: 40
      seed: 42
      # The model must beat predicting each group's training mean to be promoted.
      baseline_group: country
      # Promotion needs evidence, not a better point estimate: with ~200 test rows a gap of
      # 0.1 MAE is noise. A candidate must win this share of paired bootstrap resamples.
      bootstrap_resamples: 5000
      min_probability_better: 0.95
      # Per-group metrics and how each group's weight changed between train and test.
      stratify_by: country
      min_group_size: 5
      registered_model: coffee-total-cup-points
    # Error is reported by the score ranges a buyer uses, not by deciles.
    target_bands:
      edges: [82, 85]
      labels: ["low (<82)", "mid (82-85)", "high (>=85)"]

  # What a kilo of roasted coffee costs on a Mexico City shelf (stage 3), from what its
  # shop and its sheet say. 130 of the 167 coffees are Almanegra's: read as Almanegra's
  # pricing first.
  - name: offer # -> offer_features, offer_predictions
    description: >-
      The price per kilogram, in Mexican pesos, of a roasted coffee on a Mexico City
      roaster's shelf, from the shop, the bag's size and what the coffee's sheet says:
      origin, process, variety and altitude.
    example:
      {shop: almanegra, bag_grams: 250, country: Mexico, state: Oaxaca, processing_method: washed,
       variety: typica, altitude_m: 1600}
    # One item is one coffee in one size as one read of the catalogues found it: the same
    # offer read again is another observation of it. Drift and the model's error are
    # measured read against read, the error only on offers a read brings new.
    items:
      table: roaster_offer_history
      id: observation_id # almanegra-4432@2026-09-26
      entity: offer_id # the same offer across reads
      time: observed_on # when the catalogue was read
      period: snapshot # which read
    spec:
      target: price_mxn_per_kg
      categorical: [shop, country, state, processing_method, variety, producer]
      numeric:
        - altitude_m
        - bag_grams # the size, for the discount a bigger bag gets
        - origins_n # more than one origin is a blend
        - varieties_n
        # One column per variety the catalogues list often, because a coffee that names
        # several says "multiple" and its Gesha would be invisible. The list is in
        # domains/coffee/features.py, chosen by how often each appears, never by price.
        - variety_bourbon
        - variety_caturra
        - variety_colombia
        - variety_garnica
        - variety_gesha
        - variety_heirloom
        - variety_jember
        - variety_marsellesa
        - variety_mundo_novo
        - variety_oro_azteca
        - variety_pluma_mejorado
        - variety_ruiru_11
        - variety_sarchimor
        - variety_sl28
        - variety_sl34
        - variety_typica
      # The listed price is the target times the size.
      leakage: [price_mxn]
    training:
      # The sizes of one coffee are priced together: each coffee is on one side only,
      # and the gate's bootstrap resamples coffees, not bags.
      split:
        kind: group
        column: coffee_id
        test_share: 0.25
      cv_folds: 5
      # 118 training coffees in five folds is a noisy thing to choose hyperparameters by,
      # so the folds are drawn four times over and the trial is scored on all of them.
      cv_repeats: 4
      trials: 40
      seed: 42
      # 118 training coffees cannot support the core's default search. Left to it, the
      # tuner picked a model so slow it barely left the mean (learning rate 0.011 over
      # 174 trees) and a `min_frequency` of 27, which on 381 rows grouped nearly every
      # variety and state into "infrequent" - deleting the features this model is for.
      # Narrowed after reading the chosen parameters, never the test score; the gate
      # still decides whether what comes out is worth serving.
      search_space:
        learning_rate: [0.03, 0.2]
        n_estimators: [100, 400]
        num_leaves: [4, 16]
        min_child_samples: [5, 30]
        min_frequency: [2, 10]
      # To be promoted it must beat pricing every bag at its shop's average.
      baseline_group: shop
      bootstrap_resamples: 5000
      min_probability_better: 0.95
      stratify_by: shop
      min_group_size: 5
      registered_model: coffee-price-per-kg
    # Pesos per kilogram; the median offer sits near $1,000.
    target_bands:
      edges: [800, 1200]
      labels: ["under $800/kg", "$800-1,200/kg", "over $1,200/kg"]

  # Stage 4: where the international price of green coffee goes next month.
  - name: green_price # -> green_price_features, green_price_predictions
    description: >-
      The change, in percent, of an international green coffee price - other mild
      Arabicas or Robustas, the World Bank's monthly average - from one month to the next,
      from what the months before it show.
    example: {indicator: other_milds, month: 2026-09-01}
    # One item is one indicator in one month. The target is the change, not the price:
    # 2025 and 2026 sit above nearly every month there is to learn from, and a tree never
    # predicts above the highest value it saw. What an item knows is domains/coffee/forecast.py.
    items:
      table: price_indicators
      id: month_id # other_milds-2026-08
      time: month
      period: decade # residuals and drift by decade: the quota era, the 2011 spike, 2025
    spec:
      target: change_pct
      categorical: [indicator, calendar_month]
      numeric:
        - price_last # US cents/lb, the month before
        - change_last # its change from the month before it, %
        - change_2_back
        - change_3_back
        - change_12m # over the twelve months to the month before, %
        - gap_to_mean_12m # the last price against its twelve-month mean, %
        - volatility_6m # standard deviation of the last six changes
        - arabica_robusta_ratio
      # The month's own price: the target is computed from it.
      leakage: [usd_cents_per_lb]
    training:
      # Sixty years to learn from; the last five and a half - the 2024-2026 run-up
      # included - to be judged on, month by month in order.
      split:
        kind: temporal
        test_from: 2021-01-01
        recalibration_window: 12
      cv_folds: 5
      trials: 40
      seed: 42
      baseline_group: indicator
      # No change: next month is this month. The random walk a price forecast has to beat.
      baseline_constant: 0
      bootstrap_resamples: 5000
      min_probability_better: 0.95
      stratify_by: indicator
      min_group_size: 20
      registered_model: coffee-green-price
    # Percent, month on month; half of all months moved less than 3.3% either way.
    target_bands:
      edges: [-5, 0, 5]
      labels: ["fell over 5%", "fell up to 5%", "rose up to 5%", "rose over 5%"]

# Mexico's own coffee, from SIAP: which crop to read and in what unit. A different
# name or unit for the same id stops the run - it would change what the numbers mean.
production:
  crop_id: "5710000"
  crop: Café cereza # cherry, not green coffee: roughly four to five times the weight
  unit: Tonelada
  # The country whose world-market balance (PSD, in 60 kg bags of green coffee) the
  # municipal totals are set against.
  country: Mexico

# FAOSTAT's producer prices of coffee (source `faostat_prices`), set against the world's
# balance by country: FAO's names -> PSD's.
producer_prices:
  source: faostat_prices
  item_code: "656"
  item: Coffee, green
  country_aliases:
    Bolivia (Plurinational State of): Bolivia
    China, mainland: China
    Congo: Congo (Brazzaville)
    Côte d'Ivoire: Cote d'Ivoire
    Ethiopia PDR: Ethiopia # until 1992; the same country's series
    Lao People's Democratic Republic: Laos
    United States of America: United States
    Venezuela (Bolivarian Republic of): Venezuela
    Viet Nam: Vietnam
  # Mexico's "green coffee" price is SIAP's rural price of the cherry: the value of the
  # harvest over its tonnes, within five centavos in 2005-2024 and 1% in 2003-2004
  # (checked on every build).
  cherry: [Mexico]

# Where people pass: the Metro's and the Metrobús' stations and their entries. Every name
# of sixteen years of the Metro's counts matches the feed's, folded to its words, but two.
transit:
  stops: transit_stops
  metro: metro_ridership
  metrobus: metrobus_ridership
  station_aliases:
    zocalo tenochtitlan: zocalo
    ninos heroes: ninos heroes poder judicial cdmx

# The city in its urban AGEBs: the 2020 Census' figures for each and its polygon. Every
# coffee shop and station is placed in one, as in a borough.
census_zones:
  census: census_2020_ageb
  layer: cdmx_ageb

# What households spend on coffee to drink at home (sources `enigh_2024_*`). The survey
# records food bought over one week and states it per quarter; coffee drunk in a coffee
# shop is a meal out, not one of these. States in SIAP's names, which the production
# table uses: "México" is the State of Mexico.
household_spending:
  spending: enigh_2024_spending
  households: enigh_2024_households
  year: 2024
  products: # the survey's code -> a column of what was paid for it
    "012201": instant
    "012202": ground # beans or ground
    "012203": prepared # preparations for coffee drinks
  city: "09"
  states:
    "01": Aguascalientes
    "02": Baja California
    "03": Baja California Sur
    "04": Campeche
    "05": Coahuila
    "06": Colima
    "07": Chiapas
    "08": Chihuahua
    "09": Ciudad de México
    "10": Durango
    "11": Guanajuato
    "12": Guerrero
    "13": Hidalgo
    "14": Jalisco
    "15": México
    "16": Michoacán
    "17": Morelos
    "18": Nayarit
    "19": Nuevo León
    "20": Oaxaca
    "21": Puebla
    "22": Querétaro
    "23": Quintana Roo
    "24": San Luis Potosí
    "25": Sinaloa
    "26": Sonora
    "27": Tabasco
    "28": Tamaulipas
    "29": Tlaxcala
    "30": Veracruz
    "31": Yucatán
    "32": Zacatecas

# Who lives in each borough now (source `intercensal_2025`): the survey's columns read,
# each under this domain's name and unit. "percent" is per 100 of the group INEGI names in
# the data dictionary; a count must add up to the city's total.
borough_profile:
  source: intercensal_2025
  year: 2025
  confidence: 0.90 # the survey's intervals
  indicators:
    # People
    POBTOT: {name: population, unit: people, count: true} # in private dwellings
    MEDIANA_POBTOT: {name: median_age, unit: years}
    INDICE_ENV: {name: aging_index, unit: people 60+ per 100 under 15}
    RAZON_DEP_TOT: {name: dependency_ratio, unit: people under 15 or 65+ per 100 aged 15-64}
    PCN_PRESOE20: {name: lived_in_another_state_2020_pct, unit: percent}
    # Schooling
    GRAPROES: {name: schooling_years, unit: years}
    PCN_P15YM_ES: {name: higher_education_pct, unit: percent}
    # Work
    PCN_PEA: {name: economically_active_pct, unit: percent}
    PCN_PDESOCUP: {name: unemployment_pct, unit: percent}
    PCN_POCUP_ASA: {name: salaried_pct, unit: percent}
    PCN_POCUP_CPRO: {name: self_employed_pct, unit: percent}
    PCN_PSINDER: {name: no_health_coverage_pct, unit: percent}
    PCN_POCUP_OENT: {name: works_in_another_state_pct, unit: percent}
    PCN_POCUP_MET: {name: commutes_by_metro_or_metrobus_pct, unit: percent}
    PCN_POCUP_2HOR: {name: commute_1_to_2_hours_pct, unit: percent}
    PCN_POCUP_2HYM: {name: commute_over_2_hours_pct, unit: percent}
    # Households and dwellings
    TOTHOG: {name: households, unit: households, count: true}
    HOGJEF_F: {name: female_headed_households, unit: households, count: true}
    VIVPARHAB: {name: dwellings, unit: dwellings, count: true} # private, lived in
    PROM_OCUP: {name: occupants_per_dwelling, unit: people per dwelling}
    PRO_OCUP_C: {name: occupants_per_room, unit: people per room}
    PCN_VPH_PROPIA: {name: owned_pct, unit: percent}
    PCN_VPH_ALQUI: {name: rented_pct, unit: percent}
    PCN_VPH_INTER: {name: internet_pct, unit: percent}
    PCN_VPH_AUTOM: {name: car_pct, unit: percent}
    PCN_VPH_PC: {name: computer_pct, unit: percent}

# The studies every domain gets: profiles, drift, feature evidence, residuals.
# Stage 4: the data pipeline runs every morning in Dagster (make dagster). The ICO's page
# holds only the current month, so it has to be read every day to build its history; the
# other sources are not downloaded again before their `refresh_hours`. The model pipeline
# has no clock: it runs when the data a model reads changes.
schedule:
  data: "0 7 * * *"
  timezone: America/Mexico_City

# Stage 4: each model's newest period against the earlier ones (mlops monitor). A drifted
# target, or an error above the interval the champion was accepted with, calls for
# retraining on its own; so does this share of drifted features - half, the share
# Evidently itself calls a drifted dataset.
monitoring:
  drift_share: 0.5

analysis:
  # Groups and levels smaller than this are not reported: the numbers would be noise.
  min_rows: 5
  permutation_repeats: 10
  # Figures copied into docs/figures/ (committed, rendered on GitHub). The rest stay
  # in data/, rebuildable and untracked.
  published_figures:
    - review_target_distribution
    - review_feature_importance
    - review_residual_bias
    - offer_feature_importance
    - market_history
    - shop_kinds
    - coffee_and_schooling
    - mexico_production
    - roaster_coverage
    - flavor_profiles
    - price_ladder
    - consumer_prices
    - green_coffee_pesos

# What PROFECO's shelf prices say about coffee (stage 4). Coffee is found by product
# name: the category is spelled "Cafe" in some months and "Café" in others.
consumer_prices:
  source: profeco_prices
  closed_years: [profeco_prices_2024, profeco_prices_2025]
  products: # PROFECO's product -> which coffee it is
    Café Soluble: instant
    Café Tostado y Molido: ground
  # Read in the presentation, accents dropped and lower-cased: "Bolsa 400 Gr. Mezclado
  # con Caramelo" is a blend of coffee and sugar, priced per kilogram of both.
  sweetened: mezclado con
  decaf: descafeinado
  # The state whose shelves are given a borough, as PROFECO spells it: the one the store
  # declares, matched to INEGI's names (case and accents aside), and checked against
  # where its coordinates fall.
  city: Ciudad de México
  borough_aliases: # PROFECO's name -> INEGI's, where they differ by more than that
    Magdalena Contreras: La Magdalena Contreras

# The agent's SQL, checked after it runs. The coffee shops table holds every place of
# DENUE's class 722515 (juice stands, soda fountains, school tuck shops) and OSM's ice-cream
# parlours: counted whole, "coffee shops" came out 3,705 instead of 1,528 (2026-09-29).
agent:
  # Kept from the local agent (2026-10-01): each table the 4B reads costs it accuracy on
  # the rest. No evaluation question reads the first four; the history tables repeat the
  # current ones read by read (the agent filtered a snapshot for a register edition); the
  # city's census zones, transit and the borough survey are the map's and the studies',
  # and the price index is a tool of the studies, not a question's answer.
  hidden_tables:
    - clean.census_zones
    - clean.transit_stations
    - clean.coffee_shop_history
    - clean.roaster_origin_history
    - clean.transit_ridership
    - clean.borough_profile
    - clean.consumer_price_index
  sql_guards:
    - table: clean.coffee_shops
      requires: kind
      hint: >-
        clean.coffee_shops holds juice stands, soda fountains, ice-cream parlours and school
        tuck shops as well as coffee shops. A question about coffee shops filters
        kind = 'coffee'.
    - table: clean.coffee_shop_history
      requires: kind
      hint: >-
        clean.coffee_shop_history holds every kind of place in each read, not only coffee
        shops. A question about coffee shops filters kind = 'coffee'.

# The explorer (`make explore`): a map of the city's coffee, questions to the agent, and a
# chart of each answer. Each layer is one SELECT, run in the agent's locked session.
explore:
  title: Coffee in Mexico City
  intro: >-
    From the farm to the cup: where the city drinks its coffee, what a kilogram costs from
    the grower to the shelf, what the roasters say their coffees taste of - and a local
    agent that answers questions about all of it from the tables, the models and 17
    documents, and shows the query behind every number.
  view: {latitude: 19.39, longitude: -99.14, zoom: 10.2, pitch: 40}
  areas: {table: clean.boroughs, id: borough_id, name: borough, boundary: boundary}
  # The headline numbers: a kilogram of coffee, step by step up the ladder.
  metrics:
    - label: Cherry at the farm gate
      sql: SELECT mxn_per_kg FROM analysis.price_ladder WHERE step = 'cherry at the farm gate'
      unit: MXN/kg
      help: What a Mexican grower was paid for a kilogram of coffee cherry in 2025 (SIAP), all states together
    - label: Green coffee at the port
      sql: SELECT mxn_per_kg FROM analysis.price_ladder WHERE step = 'green coffee at the port'
      unit: MXN/kg
      help: The ICO's other mild Arabicas (World Bank, monthly) in pesos at the month's exchange rate (FRED); the line is the last two years
      trend: >-
        SELECT mxn_per_kg FROM (SELECT period, mxn_per_kg FROM analysis.green_coffee_in_pesos
        WHERE indicator = 'other_milds' ORDER BY period DESC LIMIT 24) ORDER BY period
    - label: Ground coffee on a shelf
      sql: SELECT mxn_per_kg FROM analysis.price_ladder WHERE step = 'supermarket, ground'
      unit: MXN/kg
      help: Median shelf price of plain ground coffee in Mexico City over the last twelve months (PROFECO); the line is the country's median, fortnight by fortnight since 2024
      trend: >-
        SELECT median_mxn_per_kg FROM analysis.consumer_prices_by_fortnight
        WHERE scope = 'national' AND line = 'ground' ORDER BY fortnight
    - label: A specialty roaster's coffee
      sql: SELECT mxn_per_kg FROM analysis.price_ladder WHERE step = 'specialty roaster'
      unit: MXN/kg
      help: Median price per kilogram of the bags four Mexico City roasters sell online
    - label: Coffee shops in the city
      sql: SELECT count(*) FROM clean.coffee_shops WHERE kind = 'coffee' AND source = 'denue'
      help: Places INEGI's business register names as coffee shops; its class also holds juice stands and ice-cream parlours, left out here
  layers:
    - name: Coffee shops per km² (DENUE)
      kind: areas
      unit: places per km²
      description: Places the official register names as coffee shops, per square kilometre of borough
      sql: >-
        SELECT b.borough_id, count(*) / any_value(b.area_km2) AS coffee_shops_per_km2
        FROM clean.coffee_shops s JOIN clean.boroughs b USING (borough_id)
        WHERE s.kind = 'coffee' AND s.source = 'denue' GROUP BY b.borough_id
    - name: Coffee shops per 10,000 residents (DENUE)
      kind: areas
      unit: per 10,000 residents
      description: The same coffee shops, per resident (2020 Census). The centre serves many more people than it houses
      sql: >-
        SELECT b.borough_id, count(*) * 10000.0 / any_value(b.population) AS coffee_shops_per_10k
        FROM clean.coffee_shops s JOIN clean.boroughs b USING (borough_id)
        WHERE s.kind = 'coffee' AND s.source = 'denue' GROUP BY b.borough_id
    - name: Coffee shops per 1,000 jobs (DENUE)
      kind: areas
      unit: per 1,000 jobs
      description: The same coffee shops, per job there (DENUE's workplaces of every activity, staff estimated from their bands). By day the spread shrinks
      sql: >-
        SELECT b.borough_id, count(*) * 1000.0 / any_value(b.jobs_estimate) AS coffee_shops_per_1k_jobs
        FROM clean.coffee_shops s JOIN clean.boroughs b USING (borough_id)
        WHERE s.kind = 'coffee' AND s.source = 'denue' AND b.jobs_estimate > 0
        GROUP BY b.borough_id
    - name: Coffee shops per km², block by block
      kind: areas
      unit: places per km²
      description: DENUE's coffee shops per square kilometre of each of the 2020 Census' 2,431 urban AGEBs (a few dozen blocks each); an AGEB with none is grey
      areas: {table: clean.census_zones, id: zone_id, name: zone_id, boundary: boundary}
      sql: >-
        SELECT zone_id, coffee_shops_per_km2, coffee_shops, borough
        FROM analysis.zone_coffee_shops WHERE coffee_shops > 0
    - name: Years of schooling, block by block
      kind: areas
      unit: years
      description: Average years of schooling of people 15 and over in each urban AGEB, 2020 Census
      areas: {table: clean.census_zones, id: zone_id, name: zone_id, boundary: boundary}
      sql: >-
        SELECT zone_id, schooling_years, population, borough
        FROM clean.census_zones WHERE schooling_years IS NOT NULL
    - name: Rented homes, 2025
      kind: areas
      unit: percent of dwellings
      description: INEGI's 2025 Intercensal Survey, homes lived in for a rent; the 90% interval in the tooltip
      sql: >-
        SELECT borough_id, value AS rented_pct, ci_low, ci_high
        FROM clean.borough_profile WHERE indicator = 'rented_pct'
    - name: Median age, 2025
      kind: areas
      unit: years
      description: INEGI's 2025 Intercensal Survey; half the residents are younger, half older
      sql: >-
        SELECT borough_id, value AS median_age, ci_low, ci_high
        FROM clean.borough_profile WHERE indicator = 'median_age'
    - name: Metro entries a day
      kind: areas
      unit: entries a day
      description: People entering the borough's Metro stations on an average day of the last year of the counts, each station's open days only
      sql: >-
        SELECT borough_id, metro_daily_entries, metro_stations, metrobus_stations
        FROM analysis.borough_transit WHERE metro_daily_entries > 0
    - name: Median shelf price of ground coffee
      kind: areas
      unit: MXN/kg
      description: PROFECO, plain ground coffee, pesos per kilogram, the last twelve months of the survey; 13 of the 16 boroughs have shelves in it
      sql: >-
        SELECT borough_id, median(price_mxn_per_kg) AS median_mxn_per_kg, count(*) AS prices
        FROM clean.consumer_prices
        WHERE borough_id IS NOT NULL AND product = 'ground' AND NOT sweetened AND NOT decaf
          AND date > (SELECT max(date) FROM clean.consumer_prices) - INTERVAL 1 YEAR
        GROUP BY borough_id
    - name: Coffee shops
      kind: points
      description: Coffee shops from INEGI's register (DENUE) and OpenStreetMap, side by side
      sql: >-
        SELECT name, source, borough, latitude, longitude
        FROM clean.coffee_shops WHERE kind = 'coffee'
    - name: Metro and Metrobús stations
      kind: points
      description: Every station on every line, from the city's GTFS feed
      sql: >-
        SELECT station, system, line, borough, latitude, longitude
        FROM clean.transit_stations
    - name: Shelves PROFECO priced
      kind: points
      description: The supermarkets, markets and pharmacies behind the shelf prices
      sql: >-
        SELECT store, chain, borough, latitude, longitude, count(*) AS prices
        FROM clean.consumer_prices WHERE borough_id IS NOT NULL
        GROUP BY store, chain, borough, latitude, longitude
  # Tables to slice by hand: every name here is a column of the table.
  datasets:
    - name: Coffee shops and what else the register calls a cafeteria
      description: >-
        DENUE (INEGI's register, class 722515) and OpenStreetMap, each place classified by
        its name: coffee, juice, ice cream, and the rest.
      table: clean.coffee_shops
      measures: {places: count(*)}
      dimensions: [borough, kind, source]
      filters: [kind, source]
    - name: Shelf prices of packaged coffee (PROFECO)
      description: >-
        Every price PROFECO's staff recorded for ground and instant coffee across Mexico,
        January 2024 to July 2026, per kilogram of what the jar or bag holds.
      table: clean.consumer_prices
      measures:
        median_mxn_per_kg: median(price_mxn_per_kg)
        prices: count(*)
        stores: count(DISTINCT store)
      dimensions: [product, fortnight, state, borough, chain, store_type, brand, sweetened, decaf]
      filters: [product, sweetened, decaf, state, chain]
      null_labels: {borough: outside Mexico City}
    - name: Specialty roasters' bags
      description: >-
        The four roasters' offers - a coffee in one size - with what their sheets say about
        its origin, as of the latest read of their shops.
      table: features.offer_features
      where: snapshot = (SELECT max(snapshot) FROM features.offer_features)
      measures:
        median_mxn_per_kg: median(price_mxn_per_kg)
        offers: count(*)
        coffees: count(DISTINCT coffee_id)
      dimensions: [shop, country, state, processing_method, variety, bag_grams]
      filters: [shop, country, processing_method]
      null_labels:
        country: origin not stated
        state: not a Mexican state, or not stated
        processing_method: not stated
        variety: not stated
    - name: What the roasters say their coffees taste of
      description: >-
        Tasting notes read from the shops' descriptions into the SCA's flavour categories;
        94 of the 167 coffees name at least one.
      table: clean.roaster_flavors
      measures:
        coffees: count(DISTINCT coffee_id)
        notes: count(*)
      dimensions: [category, subcategory, note_en, shop]
      filters: [shop, category]
    - name: Graded lots (CQI, 2010-2023)
      description: >-
        The Coffee Quality Institute's cupping scores. Frozen in May 2023: no newer public
        version exists.
      table: clean.coffee_reviews
      measures:
        mean_cup_points: avg(total_cup_points)
        lots: count(*)
        mean_altitude_m: avg(altitude_m)
      dimensions: [country, processing_method, variety, snapshot, color]
      filters: [snapshot, processing_method, country]
      null_labels: {processing_method: not stated, variety: not stated, color: not stated}
    - name: Mexico's harvest (SIAP, 2003-2025)
      description: >-
        Coffee cherry by state and municipality, the closing figures of every year since
        2003; split by year for the series, and filter a year for one harvest.
      table: clean.mexico_production
      measures:
        production_t: sum(production_t)
        value_mxn: sum(value_mxn)
        rural_mxn_per_t: sum(value_mxn) / sum(production_t)
        harvested_ha: sum(harvested_ha)
        municipalities: count(DISTINCT municipality_id)
      dimensions: [year, state, municipality]
      filters: [year, state]
    - name: The world market (USDA PSD)
      description: Production, exports and consumption by country and market year, thousands of 60 kg bags.
      table: clean.market_context
      measures:
        production: sum(production)
        exports: sum(exports)
        domestic_consumption: sum(domestic_consumption)
      dimensions: [market_year, country]
      filters: [country]
  # What the data says, opened without a question.
  findings:
    - title: A kilogram, from the farm to the shelf
      text: >-
        Each step is its own product - cherry, green coffee, a supermarket's ground coffee,
        a roaster's bag - so the gaps are not margins; they are the ladder a kilogram of
        coffee climbs on its way to a cup in the city.
      sql: SELECT step, mxn_per_kg FROM analysis.price_ladder
      kind: bar
      x: step
      y: mxn_per_kg
    - title: What the roasters say their coffees taste of
      text: >-
        Share of the single-origin coffees whose description names each SCA flavour
        category: Mexican coffees are called floral half as often as imported ones, and
        spiced a third as often.
      sql: >-
        SELECT "group" AS origin, category, share_pct FROM analysis.flavor_profiles
        WHERE dimension = 'origin'
      kind: bar
      x: category
      y: share_pct
      color: origin
    - title: Packaged coffee on the shelf, fortnight by fortnight
      text: >-
        Median price per kilogram across Mexico since January 2024: plain ground coffee
        from 273 to 380 pesos (+39%), instant from 645 to 958 (+49%) - while green coffee
        fell from its February 2025 peak.
      sql: >-
        SELECT fortnight, line, median_mxn_per_kg FROM analysis.consumer_prices_by_fortnight
        WHERE scope = 'national' AND line IN ('ground', 'instant', 'ground, sweetened')
      kind: line
      x: fortnight
      y: median_mxn_per_kg
      color: line
    - title: Green coffee, in pesos
      text: >-
        The ICO's other mild Arabicas, the price group Mexico's coffee trades in, at each
        month's exchange rate: for a Mexican roaster, the peso moved the cost as much as
        the market did.
      sql: >-
        SELECT period, mxn_per_kg FROM analysis.green_coffee_in_pesos
        WHERE indicator = 'other_milds' AND period >= DATE '2020-01-01'
      kind: line
      x: period
      y: mxn_per_kg
    - title: Where the city's coffee shops crowd
      text: >-
        Coffee shops per square kilometre in each borough, from INEGI's register: the
        centre, Cuauhtémoc and Benito Juárez, far above the rest.
      sql: >-
        SELECT b.borough_id, count(*) / any_value(b.area_km2) AS coffee_shops_per_km2
        FROM clean.coffee_shops s JOIN clean.boroughs b USING (borough_id)
        WHERE s.kind = 'coffee' AND s.source = 'denue' GROUP BY b.borough_id
      kind: areas
      y: coffee_shops_per_km2
    - title: Coffee shops follow schooling
      text: >-
        Coffee shops per 10,000 residents against the average years of schooling of each
        borough: the order of the two is nearly the same (Spearman 0.93). The centre
        serves many more people than live there, so read it as where cafes are.
      sql: >-
        SELECT borough, schooling_years, per_10k_people FROM analysis.borough_coffee_shops
        WHERE per_10k_people IS NOT NULL
      kind: scatter
      x: schooling_years
      y: per_10k_people
    - title: Who lives where the coffee shops are, 2025
      text: >-
        Each of INEGI's 2025 indicators ranked against coffee shops per resident across the
        16 boroughs: schooling, higher education, a computer or internet at home and renting
        rise with them (Spearman about 0.9); people per room and long commutes fall. The
        Metro commute does not follow. Sixteen points and 26 indicators: a description of
        one gradient, not 26 causes.
      sql: >-
        SELECT indicator, rho_per_10k_people FROM analysis.borough_profile_coffee
        WHERE rho_low > 0 OR rho_high < 0
      kind: bar
      x: indicator
      y: rho_per_10k_people
    - title: Block by block, the gradient fades
      text: >-
        The same question asked of 2,431 urban AGEBs instead of 16 boroughs: coffee shops
        per km² still rise with schooling, a computer and internet at home (Spearman about
        0.3, against 0.9 by borough) and barely follow how many people live there. A zone
        with a Metro station has 3.8 coffee shops on average, one without 1.4 (+2.4, 95%
        interval +1.7 to +3.3): cafes crowd where people pass, not only where people with
        schooling live.
      sql: >-
        SELECT trait, rho FROM analysis.zone_coffee_correlations
      kind: bar
      x: trait
      y: rho
    - title: Who buys coffee to drink at home
      text: >-
        INEGI's 2024 household survey: 14% of Mexico's households bought coffee for home in
        the survey's week, mostly instant. Chiapas leads (26%, 3% from their own harvest);
        the city is third (18.5%) and spends the most a household, 65 pesos a month against
        the country's 37. Coffee takes 5.4‰ of the poorest tenth's income and 0.9‰ of the
        richest's. Per state, not per alcaldia; coffee drunk in a coffee shop is not here.
      sql: >-
        SELECT state, round(100 * bought_share, 1) AS bought_pct
        FROM analysis.household_coffee_by_state WHERE state_id IS NOT NULL
        ORDER BY bought_share DESC LIMIT 12
      kind: bar
      x: state
      y: bought_pct
    - title: The cherry, in today's pesos
      text: >-
        SIAP's rural price of a kilogram of coffee cherry, in pesos of August 2026 (INEGI's
        consumer price index): 4.90 in 2003, a peak of 11.91 in 2012 and 8.45 in 2025 - up
        4.5 times in nominal pesos, 1.7 in real ones, and still 29% under 2012. On the
        country's shelves, plain ground coffee rose 28% in real terms from January 2024 to
        July 2026.
      sql: >-
        SELECT year(period) AS year, round(real_mxn_per_kg, 2) AS real_mxn_per_kg
        FROM analysis.real_prices WHERE step = 'cherry at the farm gate' ORDER BY year
      kind: line
      x: year
      y: real_mxn_per_kg
    - title: Mexico's best lots at auction
      text: >-
        Cup of Excellence Mexico, 2012-2026: the median winning lot fetches four to eight
        times the market price of its year - 26.25 US dollars a pound in 2026, about 1,000
        pesos a kilogram of green coffee, near what a roaster in the city charges for a
        kilogram roasted. Each point of score adds about 41% to the price (95% interval 37%
        to 44%, each year from its own level); Gesha lots fetch a median of 29 dollars, the
        rest 12.
      sql: >-
        SELECT year, median_usd_per_lb, top_usd_per_lb, commodity_usd_per_lb
        FROM analysis.coe_by_year ORDER BY year
      kind: line
      x: year
      y: median_usd_per_lb
    - title: The Metro has not come back
      text: >-
        Entries on an average day: the Metro carried 4.2 to 4.6 million a day from 2010 to
        2019, half that in 2020, and 3.4 million in 2025 - still a fifth fewer - while the
        Metrobús, which counts per line, went from 1.2 to 1.4 million. Where the Metro's
        stations board the most people (Cuauhtémoc, 786,000 a day), coffee shops are most
        (Spearman 0.76 across the boroughs, by count).
      sql: >-
        SELECT year, system, daily_entries FROM analysis.transit_by_year WHERE year < 2026
      kind: line
      x: year
      y: daily_entries
      color: system
    - title: What farmers keep of the port price
      text: >-
        FAOSTAT's producer prices against the World Bank's price of each country's own mix
        of arabica and robusta, 2024: Kenya's growers were paid 87% of it, Brazil's 72%,
        Colombia's 66%, Peru's 51%. Vietnam's 16% follows a series that halved in 2022 with
        no flag to say why. About 20 countries report a year; Mexico's figure is the
        cherry's, not green coffee's, and is left out.
      sql: >-
        SELECT country, round(100 * share_of_benchmark, 1) AS pct_of_port_price
        FROM analysis.farmgate_prices
        WHERE year = 2024 AND production >= 900
        ORDER BY pct_of_port_price DESC
      kind: bar
      x: country
      y: pct_of_port_price
    - title: By day, the spread shrinks
      text: >-
        Coffee shops per resident vary 6.6 times from borough to borough, and per job (DENUE's
        workplaces of every activity) 2.7 times: 0.67 to 1.82 per 1,000 jobs. Cuauhtémoc
        and Miguel Hidalgo hold as many jobs as residents; where people work explains much
        of the centre.
      sql: >-
        SELECT borough, per_10k_people, per_1k_jobs FROM analysis.borough_coffee_shops
        WHERE per_1k_jobs IS NOT NULL
      kind: scatter
      x: per_10k_people
      y: per_1k_jobs
    - title: Most places entered the register with a census
      text: >-
        DENUE's places today, by the edition each entered the register. Nine in ten came
        in its first edition (2010) or right after an economic census (2014, 2019, 2024):
        an entry says when INEGI came by, not when a place opened.
      sql: >-
        SELECT strftime(listed_since, '%Y-%m') AS edition, places, coffee_shops
        FROM analysis.register_editions
      kind: bar
      x: edition
      y: places
    - title: Mexico's harvest since 2003
      text: >-
        Tonnes of coffee cherry, every closing year of SIAP's statistics: Mexico grew 1.7
        million in 2004 and less than half of that in 2016, and 1.07 million in 2025.
      sql: >-
        SELECT year, sum(production_t) / 1000 AS thousand_t
        FROM clean.mexico_production GROUP BY year ORDER BY year
      kind: line
      x: year
      y: thousand_t
    - title: Who grows Mexico's coffee
      text: >-
        Share of the 2025 harvest of coffee cherry by state: Chiapas, Veracruz, Puebla and
        Oaxaca grow nine kilograms in ten.
      sql: >-
        SELECT state, share_pct FROM analysis.production_by_state
        WHERE year = (SELECT max(year) FROM analysis.production_by_state)
      kind: bar
      x: state
      y: share_pct
  about: |
    **The sources.** Every number comes from a public source, downloaded untouched and
    kept for good, then cleaned against a contract:

    - **INEGI's business register (DENUE)**: the city's places in class 722515 -
      coffee shops, but also juice stands and ice-cream parlours; each is classified by
      its name.
    - **OpenStreetMap**: coffee shops mapped by volunteers (ODbL). Thorough in the centre,
      thin in the east: a map of OSM alone measures where mappers live.
    - **PROFECO's "Quién es Quién en los Precios"**: supermarket and market shelf prices,
      every fortnight since January 2024.
    - **Four specialty roasters' online shops** (Almanegra, Buna, Café con Jiribilla,
      Cucurucho), read politely: what they sell, at what price, and what they say it
      tastes of.
    - **SIAP** (Mexico's harvest), **USDA PSD** (the world market), the **World Bank**
      and the **ICO** (the price of green coffee), **FAOSTAT** (what growers are paid),
      **FRED** (pesos per dollar), and INEGI's 2020 Census, its 2025 Intercensal Survey
      and DENUE's count of every workplace (who lives and works in each borough).
    - **The Coffee Quality Institute's cupping scores**, frozen in May 2023 - the only
      source here that is not current.
    - **22 documents** the agent reads: World Coffee Research's variety catalogues, the
      SCA's cupping standards, FAO's arabica manual, the ICO's and the USDA's reports
      (Mexico's own among them), five reviews and four papers on brewing.

    **The limits.** The roasters' notes are their own claims, written to sell, not a
    cupper's. The price model learns mostly from one shop. The agent's model is small
    and local: its query is always shown, because a query can run and answer a slightly
    different question.
  examples:
    - Which boroughs have the most coffee shops per square kilometre, according to DENUE?
    - What is the median price per kilogram of ground coffee, neither sweetened nor decaf, on the shelves of each borough?
    - Across the country, what was the median price per kilogram of instant coffee, neither sweetened nor decaf, in each fortnight of 2026?
    - How did the monthly price of other mild Arabicas change in 2026, in US cents per pound?
    - Which flavour categories do the roasters name most often in their tasting notes?
    - What would a 250 g bag of washed Gesha from Chiapas cost at Almanegra?
    - Why does altitude change how a coffee tastes?

# Coffee's own studies: which slice of the world market to summarise.
market_analysis:
  market_year: 2025
  top_countries: 10
  # The country the domestic-market view follows through time.
  spotlight_country: Mexico
  history_since: 2015
